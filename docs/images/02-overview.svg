<svg xmlns="http://www.w3.org/2000/svg" width="760" height="686" viewBox="0 0 760 686" role="img" aria-labelledby="title desc">
<title id="title">A tensor view describes existing storage</title><desc id="desc">Shape and strides determine which address a multidimensional index selects. Row-major offset(i, j) = i × columns + j</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="684" rx="16" fill="#fbfaf7" stroke="#d8dedb" stroke-width="1.5"/><text x="32" y="36" font-size="13" fill="#0e756d" font-weight="700" text-anchor="start">C++ INFERENCE AT THE EDGE  /  OVERVIEW</text><text x="32" y="78" font-size="27" fill="#182d38" font-weight="600" text-anchor="start">A tensor view describes existing storage</text><text x="32" y="116" font-size="18" fill="#526674" font-weight="400" text-anchor="start">Shape and strides determine which address a multidimensional index</text><text x="32" y="142" font-size="18" fill="#526674" font-weight="400" text-anchor="start">selects.</text><rect x="32" y="184" width="320" height="184" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="50" y="211" font-size="13" fill="#b94c27" font-weight="700" text-anchor="start">01</text><text x="50" y="243" font-size="21" fill="#182d38" font-weight="600" text-anchor="start">Arena storage</text><text x="50" y="297" font-size="18" fill="#526674" font-weight="400" text-anchor="start">Allocate a contiguous buffer</text><rect x="408" y="184" width="320" height="184" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="426" y="211" font-size="13" fill="#b94c27" font-weight="700" text-anchor="start">02</text><text x="426" y="243" font-size="21" fill="#182d38" font-weight="600" text-anchor="start">Extents</text><text x="426" y="297" font-size="18" fill="#526674" font-weight="400" text-anchor="start">Set rows and columns</text><rect x="408" y="398" width="320" height="184" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="426" y="425" font-size="13" fill="#b94c27" font-weight="700" text-anchor="start">03</text><text x="426" y="457" font-size="21" fill="#182d38" font-weight="600" text-anchor="start">Layout and strides</text><text x="426" y="511" font-size="18" fill="#526674" font-weight="400" text-anchor="start">Translate indices to offsets</text><rect x="32" y="398" width="320" height="184" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="50" y="425" font-size="13" fill="#b94c27" font-weight="700" text-anchor="start">04</text><text x="50" y="457" font-size="21" fill="#182d38" font-weight="600" text-anchor="start">mdspan view</text><text x="50" y="511" font-size="18" fill="#526674" font-weight="400" text-anchor="start">Access without copying data</text><path d="M356 262 L402 262" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><path d="M568 372 L568 392" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><path d="M404 476 L358 476" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="608" width="696" height="58" rx="12" fill="#eaf2ef" stroke="#d2e1db" stroke-width="1.5"/><text x="48" y="637" font-size="16" fill="#0e756d" font-weight="400" text-anchor="start">Row-major offset(i, j) = i × columns + j</text></g></svg>