<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
<title id="title">A tensor view describes existing storage</title><desc id="desc">Shape and strides determine which address a multidimensional index selects.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#738993"/></marker></defs>
<g font-family="Roboto, Arial, sans-serif"><rect x="1" y="1" width="1118" height="468" rx="18" fill="#fbfaf7" stroke="#d8dedb" stroke-width="1.5"/>
<path d="M32 38 H74" stroke="#c0441f" stroke-width="5" stroke-linecap="round"/>
<text x="32" y="83" font-size="29" fill="#182d38" font-weight="400">A tensor view describes existing storage</text>
<text x="32" y="124" font-size="18" fill="#526674" font-weight="400">Shape and strides determine which address a multidimensional index selects.</text>
<rect x="54" y="190" width="88" height="46" rx="14" fill="#ffe4d6" stroke="#cbd5d8" stroke-width="1.5"/><text x="84" y="220" font-size="20" fill="#182d38" font-weight="400">0</text><rect x="154" y="190" width="88" height="46" rx="14" fill="#ffe4d6" stroke="#cbd5d8" stroke-width="1.5"/><text x="184" y="220" font-size="20" fill="#182d38" font-weight="400">1</text><rect x="254" y="190" width="88" height="46" rx="14" fill="#ffe4d6" stroke="#cbd5d8" stroke-width="1.5"/><text x="284" y="220" font-size="20" fill="#182d38" font-weight="400">2</text><rect x="354" y="190" width="88" height="46" rx="14" fill="#ffe4d6" stroke="#cbd5d8" stroke-width="1.5"/><text x="384" y="220" font-size="20" fill="#182d38" font-weight="400">3</text><rect x="54" y="248" width="88" height="46" rx="14" fill="#ffe4d6" stroke="#cbd5d8" stroke-width="1.5"/><text x="84" y="278" font-size="20" fill="#182d38" font-weight="400">4</text><rect x="154" y="248" width="88" height="46" rx="14" fill="#ffe4d6" stroke="#cbd5d8" stroke-width="1.5"/><text x="184" y="278" font-size="20" fill="#182d38" font-weight="400">5</text><rect x="254" y="248" width="88" height="46" rx="14" fill="#f9dfca" stroke="#cbd5d8" stroke-width="1.5"/><text x="284" y="278" font-size="20" fill="#182d38" font-weight="400">6</text><rect x="354" y="248" width="88" height="46" rx="14" fill="#ffe4d6" stroke="#cbd5d8" stroke-width="1.5"/><text x="384" y="278" font-size="20" fill="#182d38" font-weight="400">7</text><rect x="54" y="306" width="88" height="46" rx="14" fill="#ffe4d6" stroke="#cbd5d8" stroke-width="1.5"/><text x="84" y="336" font-size="20" fill="#182d38" font-weight="400">8</text><rect x="154" y="306" width="88" height="46" rx="14" fill="#ffe4d6" stroke="#cbd5d8" stroke-width="1.5"/><text x="184" y="336" font-size="20" fill="#182d38" font-weight="400">9</text><rect x="254" y="306" width="88" height="46" rx="14" fill="#ffe4d6" stroke="#cbd5d8" stroke-width="1.5"/><text x="284" y="336" font-size="20" fill="#182d38" font-weight="400">10</text><rect x="354" y="306" width="88" height="46" rx="14" fill="#ffe4d6" stroke="#cbd5d8" stroke-width="1.5"/><text x="384" y="336" font-size="20" fill="#182d38" font-weight="400">11</text><text x="54" y="390" font-size="20" fill="#182d38" font-weight="400">3 × 4 view, row-major storage</text><path d="M468 270 H550" stroke="#738993" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/><rect x="580" y="192" width="474" height="172" rx="14" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="606" y="230" font-size="24" fill="#182d38" font-weight="600">Element at [1, 2]</text><text x="606" y="276" font-size="24" fill="#a33516" font-weight="400">offset = 1 × 4 + 2 = 6</text><text x="606" y="322" font-size="19" fill="#526674" font-weight="400">The view owns no copied payload.</text></g></svg>