<svg xmlns="http://www.w3.org/2000/svg" width="760" height="710" viewBox="0 0 760 710" role="img" aria-labelledby="title desc">
<title id="title">Share work without racing on state</title><desc id="desc">Workers coordinate ownership and publication through explicit synchronization. A data race is undefined behavior; volatile does not provide thread synchronization.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993" /></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="708" rx="16" fill="#181e30" stroke="#3a455c" stroke-width="1.5" /><text x="32" y="36" font-size="13" fill="#8ed5c4" font-weight="700" text-anchor="start">C++ INFERENCE AT THE EDGE  /  OVERVIEW</text><text x="32" y="78" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">Share work without racing on state</text><text x="32" y="116" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">Workers coordinate ownership and publication through explicit</text><text x="32" y="142" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">synchronization.</text><rect x="32" y="184" width="320" height="184" rx="12" fill="#26324a" stroke="#5c6c88" stroke-width="1.5" /><text x="50" y="211" font-size="13" fill="#f3b486" font-weight="700" text-anchor="start">01</text><text x="50" y="243" font-size="21" fill="#f5f4fa" font-weight="600" text-anchor="start">Partition work</text><text x="50" y="297" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">Assign independent ranges</text><rect x="408" y="184" width="320" height="184" rx="12" fill="#26324a" stroke="#5c6c88" stroke-width="1.5" /><text x="426" y="211" font-size="13" fill="#f3b486" font-weight="700" text-anchor="start">02</text><text x="426" y="243" font-size="21" fill="#f5f4fa" font-weight="600" text-anchor="start">Run workers</text><text x="426" y="297" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">Each owns its output region</text><rect x="408" y="398" width="320" height="184" rx="12" fill="#26324a" stroke="#5c6c88" stroke-width="1.5" /><text x="426" y="425" font-size="13" fill="#f3b486" font-weight="700" text-anchor="start">03</text><text x="426" y="457" font-size="21" fill="#f5f4fa" font-weight="600" text-anchor="start">Synchronize</text><text x="426" y="511" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">Join, barrier or atomic</text><text x="426" y="536" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">handoff</text><rect x="32" y="398" width="320" height="184" rx="12" fill="#26324a" stroke="#5c6c88" stroke-width="1.5" /><text x="50" y="425" font-size="13" fill="#f3b486" font-weight="700" text-anchor="start">04</text><text x="50" y="457" font-size="21" fill="#f5f4fa" font-weight="600" text-anchor="start">Consume results</text><text x="50" y="511" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">Read after publication</text><path d="M356 262 L402 262" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><path d="M568 372 L568 392" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><path d="M404 476 L358 476" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><rect x="32" y="608" width="696" height="82" rx="12" fill="#253d40" stroke="#426b66" stroke-width="1.5" /><text x="48" y="637" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">A data race is undefined behavior; volatile does not provide thread</text><text x="48" y="661" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">synchronization.</text></g></svg>