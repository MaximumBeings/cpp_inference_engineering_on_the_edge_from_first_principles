<text x="32" y="83" font-size="29" fill="#182d38" font-weight="400">Continuous batching schedules active requests</text>
<text x="32" y="124" font-size="18" fill="#526674" font-weight="400">Retire completed work and admit new requests at iteration boundaries.</text>
