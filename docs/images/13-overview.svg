<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
<title id="title">The KV cache preserves attention history</title><desc id="desc">New tokens append keys and values; each query reads the retained history.</desc>
