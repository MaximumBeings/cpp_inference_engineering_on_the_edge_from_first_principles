<path d="M32 38 H74" stroke="#c0441f" stroke-width="5" stroke-linecap="round"/>
<text x="32" y="83" font-size="29" fill="#182d38" font-weight="400">The KV cache preserves attention history</text>
<text x="32" y="124" font-size="18" fill="#526674" font-weight="400">New tokens append keys and values; each query reads the retained history.</text>
