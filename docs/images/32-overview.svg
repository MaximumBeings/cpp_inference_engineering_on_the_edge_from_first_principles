<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
<title id="title">Tiled attention keeps the score matrix out of global memory</title><desc id="desc">Each query retains running softmax statistics while K/V tiles pass through shared memory.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#738993"/></marker></defs>
<g font-family="Roboto, Arial, sans-serif"><rect x="1" y="1" width="1118" height="468" rx="18" fill="#fbfaf7" stroke="#d8dedb" stroke-width="1.5"/>
<path d="M32 38 H74" stroke="#bd591c" stroke-width="5" stroke-linecap="round"/>
<text x="32" y="83" font-size="29" fill="#182d38" font-weight="400">Tiled attention keeps the score matrix out of global memory</text>
<text x="32" y="124" font-size="18" fill="#526674" font-weight="400">Each query retains running softmax statistics while K/V tiles pass through shared memory.</text>
<rect x="32" y="183" width="220" height="151" rx="14" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="54" y="220" font-size="23" fill="#182d38" font-weight="600">Query row</text><text x="54" y="263" font-size="18" fill="#182d38" font-weight="400">One thread owns its</text><text x="54" y="288" font-size="18" fill="#182d38" font-weight="400">running state</text><path d="M260 252 H302" stroke="#738993" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/><rect x="322" y="183" width="300" height="151" rx="14" fill="#edf3f1" stroke="#cbd5d8" stroke-width="1.5"/><text x="344" y="220" font-size="23" fill="#182d38" font-weight="600">Shared-memory tile</text><text x="344" y="263" font-size="18" fill="#182d38" font-weight="400">Load up to 32 keys and</text><text x="344" y="288" font-size="18" fill="#182d38" font-weight="400">values; synchronize</text><text x="344" y="313" font-size="18" fill="#182d38" font-weight="400">threads</text><path d="M630 252 H672" stroke="#738993" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/><rect x="696" y="183" width="390" height="151" rx="14" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="718" y="220" font-size="23" fill="#182d38" font-weight="600">Online softmax state</text><text x="718" y="266" font-size="20" fill="#182d38" font-weight="400">Running max m, sum ℓ, output o</text><text x="718" y="306" font-size="18" fill="#526674" font-weight="400">Rescale old state for each new tile.</text><text x="36" y="382" font-size="22" fill="#0e756d" font-weight="400">Repeat over K/V tiles → normalize o / ℓ → write one output row</text><text x="36" y="424" font-size="18" fill="#526674" font-weight="400">A100 validation covers partial 32-key tiles, partial 128-thread blocks and d ≤ 64.</text></g></svg>