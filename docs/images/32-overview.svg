<svg xmlns="http://www.w3.org/2000/svg" width="760" height="744" viewBox="0 0 760 744" role="img" aria-labelledby="title desc">
<title id="title">Tiled attention keeps the score matrix out of global memory</title><desc id="desc">Each query retains running softmax statistics while K/V tiles pass through shared memory. Validate partial tiles and query blocks against the CPU reference on a physical GPU.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993" /></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="742" rx="16" fill="#0b2e63" stroke="#375d8e" stroke-width="1.5" /><text x="32" y="36" font-size="13" fill="#8ed5c4" font-weight="700" text-anchor="start">C++ INFERENCE AT THE EDGE  /  OVERVIEW</text><text x="32" y="78" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">Tiled attention keeps the score matrix out of</text><text x="32" y="112" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">global memory</text><text x="32" y="150" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">Each query retains running softmax statistics while K/V tiles pass</text><text x="32" y="176" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">through shared memory.</text><rect x="32" y="218" width="320" height="184" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="50" y="245" font-size="13" fill="#f3b486" font-weight="700" text-anchor="start">01</text><text x="50" y="277" font-size="21" fill="#f5f4fa" font-weight="600" text-anchor="start">Load K/V tile</text><text x="50" y="331" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">Cooperate through shared</text><text x="50" y="356" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">memory</text><rect x="408" y="218" width="320" height="184" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="426" y="245" font-size="13" fill="#f3b486" font-weight="700" text-anchor="start">02</text><text x="426" y="277" font-size="21" fill="#f5f4fa" font-weight="600" text-anchor="start">Compute tile scores</text><text x="426" y="331" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">QKᵀ scaled by √d</text><rect x="408" y="432" width="320" height="184" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="426" y="459" font-size="13" fill="#f3b486" font-weight="700" text-anchor="start">03</text><text x="426" y="491" font-size="21" fill="#f5f4fa" font-weight="600" text-anchor="start">Update online state</text><text x="426" y="545" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">Running maximum, sum and</text><text x="426" y="570" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">output</text><rect x="32" y="432" width="320" height="184" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="50" y="459" font-size="13" fill="#f3b486" font-weight="700" text-anchor="start">04</text><text x="50" y="491" font-size="21" fill="#f5f4fa" font-weight="600" text-anchor="start">Finalize row</text><text x="50" y="545" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">Normalize accumulated output</text><path d="M356 296 L402 296" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><path d="M568 406 L568 426" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><path d="M404 510 L358 510" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><rect x="32" y="642" width="696" height="82" rx="12" fill="#123e68" stroke="#467fac" stroke-width="1.5" /><text x="48" y="671" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">Validate partial tiles and query blocks against the CPU reference on a</text><text x="48" y="695" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">physical GPU.</text></g></svg>