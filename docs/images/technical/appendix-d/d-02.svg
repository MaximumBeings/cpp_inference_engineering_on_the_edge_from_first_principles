<svg xmlns="http://www.w3.org/2000/svg" width="760" height="550" viewBox="0 0 760 550" role="img" aria-labelledby="title desc">
<title id="title">A bandwidth benchmark needs a declared byte count</title><desc id="desc">Report the actual read/write traffic definition and repeated measurements. The theoretical bound is not an achieved result.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993" /></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="548" rx="16" fill="#181e30" stroke="#3a455c" stroke-width="1.5" /><text x="32" y="36" font-size="13" fill="#8ed5c4" font-weight="700" text-anchor="start">CONCEPT D.2  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">A bandwidth benchmark needs a declared byte</text><text x="32" y="112" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">count</text><rect x="32" y="160" width="320" height="116" rx="12" fill="#26324a" stroke="#5c6c88" stroke-width="1.5" /><text x="50" y="190" font-size="14" fill="#f3b486" font-weight="700" text-anchor="start">01</text><text x="50" y="222" font-size="20" fill="#f5f4fa" font-weight="500" text-anchor="start">Allocate and initialize</text><text x="50" y="249" font-size="20" fill="#f5f4fa" font-weight="500" text-anchor="start">buffers</text><rect x="408" y="160" width="320" height="116" rx="12" fill="#26324a" stroke="#5c6c88" stroke-width="1.5" /><text x="426" y="190" font-size="14" fill="#f3b486" font-weight="700" text-anchor="start">02</text><text x="426" y="222" font-size="20" fill="#f5f4fa" font-weight="500" text-anchor="start">Warm up the measured</text><text x="426" y="249" font-size="20" fill="#f5f4fa" font-weight="500" text-anchor="start">operation</text><rect x="408" y="308" width="320" height="116" rx="12" fill="#26324a" stroke="#5c6c88" stroke-width="1.5" /><text x="426" y="338" font-size="14" fill="#f3b486" font-weight="700" text-anchor="start">03</text><text x="426" y="370" font-size="20" fill="#f5f4fa" font-weight="500" text-anchor="start">Time completed work</text><rect x="32" y="308" width="320" height="116" rx="12" fill="#26324a" stroke="#5c6c88" stroke-width="1.5" /><text x="50" y="338" font-size="14" fill="#f3b486" font-weight="700" text-anchor="start">04</text><text x="50" y="370" font-size="20" fill="#f5f4fa" font-weight="500" text-anchor="start">Compute bytes / elapsed</text><text x="50" y="397" font-size="20" fill="#f5f4fa" font-weight="500" text-anchor="start">time</text><path d="M356 216 L402 216" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><path d="M568 280 L568 302" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><path d="M404 364 L358 364" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><rect x="32" y="448" width="696" height="82" rx="12" fill="#253d40" stroke="#426b66" stroke-width="1.5" /><text x="48" y="477" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">Report the actual read/write traffic definition and repeated measurements.</text><text x="48" y="501" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">The theoretical bound is not an achieved result.</text></g></svg>