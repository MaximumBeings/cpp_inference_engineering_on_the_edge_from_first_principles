<svg xmlns="http://www.w3.org/2000/svg" width="760" height="647" viewBox="0 0 760 647" role="img" aria-labelledby="title desc">
<title id="title">Generation and conversation have nested lifetimes</title><desc id="desc">A turn boundary is not automatically a model reload or a complete state reset.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993" /></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="645" rx="16" fill="#0b2e63" stroke="#375d8e" stroke-width="1.5" /><text x="32" y="36" font-size="13" fill="#8ed5c4" font-weight="700" text-anchor="start">CONCEPT 16.3  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">Generation and conversation have nested</text><text x="32" y="112" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">lifetimes</text><text x="32" y="182" font-size="18" fill="#8ed5c4" font-weight="600" text-anchor="start">Conversation</text><rect x="32" y="200" width="212" height="72" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="44" y="229" font-size="17" fill="#f5f4fa" font-weight="400" text-anchor="start">template messages</text><path d="M248 236 L268 236" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><rect x="274" y="200" width="212" height="72" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="286" y="229" font-size="17" fill="#f5f4fa" font-weight="400" text-anchor="start">retain history</text><path d="M490 236 L510 236" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><rect x="516" y="200" width="212" height="72" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="528" y="229" font-size="17" fill="#f5f4fa" font-weight="400" text-anchor="start">next turn</text><text x="32" y="309" font-size="18" fill="#8ed5c4" font-weight="600" text-anchor="start">Generation</text><rect x="32" y="327" width="212" height="72" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="44" y="356" font-size="17" fill="#f5f4fa" font-weight="400" text-anchor="start">prefill input</text><path d="M248 363 L268 363" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><rect x="274" y="327" width="212" height="72" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="286" y="356" font-size="17" fill="#f5f4fa" font-weight="400" text-anchor="start">decode tokens</text><path d="M490 363 L510 363" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><rect x="516" y="327" width="212" height="72" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="528" y="356" font-size="17" fill="#f5f4fa" font-weight="400" text-anchor="start">stop condition</text><text x="32" y="436" font-size="18" fill="#8ed5c4" font-weight="600" text-anchor="start">Resources</text><rect x="32" y="454" width="212" height="72" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="44" y="483" font-size="17" fill="#f5f4fa" font-weight="400" text-anchor="start">model stays loaded</text><path d="M248 490 L268 490" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><rect x="274" y="454" width="212" height="72" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="286" y="483" font-size="17" fill="#f5f4fa" font-weight="400" text-anchor="start">KV grows or resets</text><path d="M490 490 L510 490" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><rect x="516" y="454" width="212" height="72" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="528" y="483" font-size="17" fill="#f5f4fa" font-weight="400" text-anchor="start">scratch reused</text><rect x="32" y="545" width="696" height="82" rx="12" fill="#123e68" stroke="#467fac" stroke-width="1.5" /><text x="48" y="574" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">A turn boundary is not automatically a model reload or a complete state</text><text x="48" y="598" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">reset.</text></g></svg>