<svg xmlns="http://www.w3.org/2000/svg" width="760" height="574" viewBox="0 0 760 574" role="img" aria-labelledby="title desc">
<title id="title">Travel consistency compares distance with elapsed time</title><desc id="desc">Check timestamp quality, location confidence and shared accounts. A rule hit can have benign causes.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993" /></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="572" rx="16" fill="#181e30" stroke="#3a455c" stroke-width="1.5" /><text x="32" y="36" font-size="13" fill="#8ed5c4" font-weight="700" text-anchor="start">CONCEPT 29.3  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">Travel consistency compares distance with</text><text x="32" y="112" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">elapsed time</text><rect x="32" y="160" width="696" height="60" rx="12" fill="#26324a" stroke="#5c6c88" stroke-width="1.5" /><text x="54" y="196" font-size="15" fill="#f3b486" font-weight="700" text-anchor="start">01</text><text x="110" y="197" font-size="21" fill="#f5f4fa" font-weight="400" text-anchor="start">location A at t1</text><rect x="32" y="236" width="696" height="60" rx="12" fill="#26324a" stroke="#5c6c88" stroke-width="1.5" /><text x="54" y="272" font-size="15" fill="#f3b486" font-weight="700" text-anchor="start">02</text><text x="110" y="273" font-size="21" fill="#f5f4fa" font-weight="400" text-anchor="start">location B at t2</text><rect x="32" y="312" width="696" height="60" rx="12" fill="#26324a" stroke="#5c6c88" stroke-width="1.5" /><text x="54" y="348" font-size="15" fill="#f3b486" font-weight="700" text-anchor="start">03</text><text x="110" y="349" font-size="21" fill="#f5f4fa" font-weight="400" text-anchor="start">elapsed = t2 - t1</text><rect x="32" y="388" width="696" height="60" rx="12" fill="#253d40" stroke="#5c6c88" stroke-width="1.5" /><text x="54" y="424" font-size="15" fill="#f3b486" font-weight="700" text-anchor="start">04</text><text x="110" y="425" font-size="21" fill="#f5f4fa" font-weight="400" text-anchor="start">required speed = distance / elapsed</text><rect x="32" y="472" width="696" height="82" rx="12" fill="#253d40" stroke="#426b66" stroke-width="1.5" /><text x="48" y="501" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">Check timestamp quality, location confidence and shared accounts. A rule</text><text x="48" y="525" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">hit can have benign causes.</text></g></svg>