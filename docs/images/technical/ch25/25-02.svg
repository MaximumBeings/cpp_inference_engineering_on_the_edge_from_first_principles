<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="526" rx="16" fill="#fbfaf7" stroke="#d8dedb" stroke-width="1.5"/><text x="32" y="36" font-size="13" fill="#a33516" font-weight="700" text-anchor="start">CONCEPT 25.2  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#182d38" font-weight="600" text-anchor="start">Evidence handling preserves source identity</text><rect x="32" y="138" width="320" height="116" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="50" y="168" font-size="14" fill="#9c3619" font-weight="700" text-anchor="start">01</text><text x="50" y="200" font-size="20" fill="#182d38" font-weight="500" text-anchor="start">Capture source</text><rect x="408" y="138" width="320" height="116" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="426" y="168" font-size="14" fill="#9c3619" font-weight="700" text-anchor="start">02</text><text x="426" y="200" font-size="20" fill="#182d38" font-weight="500" text-anchor="start">Hash and timestamp</text><rect x="408" y="286" width="320" height="116" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="426" y="316" font-size="14" fill="#9c3619" font-weight="700" text-anchor="start">03</text><text x="426" y="348" font-size="20" fill="#182d38" font-weight="500" text-anchor="start">Draft incident narrative</text><rect x="32" y="286" width="320" height="116" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="50" y="316" font-size="14" fill="#9c3619" font-weight="700" text-anchor="start">04</text><text x="50" y="348" font-size="20" fill="#182d38" font-weight="500" text-anchor="start">Record custody and edits</text><path d="M356 194 L402 194" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><path d="M568 258 L568 280" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><path d="M404 342 L358 342" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="426" width="696" height="82" rx="12" fill="#fff0e8" stroke="#e9b9a5" stroke-width="1.5"/><text x="48" y="455" font-size="16" fill="#a33516" font-weight="400" text-anchor="start">A generated narrative is derived material. Retain the original and an</text><text x="48" y="479" font-size="16" fill="#a33516" font-weight="400" text-anchor="start">auditable derivation trail.</text></g></svg>