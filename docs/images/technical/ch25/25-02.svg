<svg xmlns="http://www.w3.org/2000/svg" width="760" height="528" viewBox="0 0 760 528" role="img" aria-labelledby="title desc">
<title id="title">Evidence handling preserves source identity</title><desc id="desc">A generated narrative is derived material. Retain the original and an auditable derivation trail.</desc>
