<svg xmlns="http://www.w3.org/2000/svg" width="760" height="616" viewBox="0 0 760 616" role="img" aria-labelledby="title desc">
<title id="title">Several query heads can share one KV head</title><desc id="desc">Illustrative GQA ratio 2:1. Query heads remain distinct while cached keys and values are shared.</desc>
