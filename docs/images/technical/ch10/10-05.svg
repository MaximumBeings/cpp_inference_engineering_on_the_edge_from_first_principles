<svg xmlns="http://www.w3.org/2000/svg" width="760" height="638" viewBox="0 0 760 638" role="img" aria-labelledby="title desc">
<title id="title">Work ownership can move without duplicating work</title><desc id="desc">Scheduling order is nondeterministic. The correctness check must not depend on one task order.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="636" rx="16" fill="#fbfaf7" stroke="#d8dedb" stroke-width="1.5"/><text x="32" y="36" font-size="13" fill="#a33516" font-weight="700" text-anchor="start">CONCEPT 10.5  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#182d38" font-weight="600" text-anchor="start">Work ownership can move without duplicating</text><text x="32" y="112" font-size="27" fill="#182d38" font-weight="600" text-anchor="start">work</text><rect x="32" y="160" width="286" height="74" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><rect x="408" y="160" width="320" height="74" rx="12" fill="#ffe4d6" stroke="#cbd5d8" stroke-width="1.5"/><text x="48" y="191" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">Deque A</text><text x="424" y="191" font-size="18" fill="#a33516" font-weight="400" text-anchor="start">tasks 0,1,2</text><path d="M322 197 L402 197" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="252" width="286" height="74" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><rect x="408" y="252" width="320" height="74" rx="12" fill="#ffe4d6" stroke="#cbd5d8" stroke-width="1.5"/><text x="48" y="283" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">Deque B</text><text x="424" y="283" font-size="18" fill="#a33516" font-weight="400" text-anchor="start">tasks 3,4</text><path d="M322 289 L402 289" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="344" width="286" height="74" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><rect x="408" y="344" width="320" height="74" rx="12" fill="#ffe4d6" stroke="#cbd5d8" stroke-width="1.5"/><text x="48" y="375" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">Idle worker</text><text x="424" y="375" font-size="18" fill="#a33516" font-weight="400" text-anchor="start">steal an available task</text><path d="M322 381 L402 381" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="436" width="286" height="74" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><rect x="408" y="436" width="320" height="74" rx="12" fill="#ffe4d6" stroke="#cbd5d8" stroke-width="1.5"/><text x="48" y="467" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">Completion check</text><text x="424" y="467" font-size="18" fill="#a33516" font-weight="400" text-anchor="start">every task exactly once</text><path d="M322 473 L402 473" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="536" width="696" height="82" rx="12" fill="#fff0e8" stroke="#e9b9a5" stroke-width="1.5"/><text x="48" y="565" font-size="16" fill="#a33516" font-weight="400" text-anchor="start">Scheduling order is nondeterministic. The correctness check must not depend</text><text x="48" y="589" font-size="16" fill="#a33516" font-weight="400" text-anchor="start">on one task order.</text></g></svg>