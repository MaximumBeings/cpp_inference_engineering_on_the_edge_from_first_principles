<svg xmlns="http://www.w3.org/2000/svg" width="760" height="508" viewBox="0 0 760 508" role="img" aria-labelledby="title desc">
<title id="title">Synchronization establishes a happens-before relation</title><desc id="desc">A data race is not merely a performance issue; the language does not define the program behavior.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993" /></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="506" rx="16" fill="#181e30" stroke="#3a455c" stroke-width="1.5" /><text x="32" y="36" font-size="13" fill="#8ed5c4" font-weight="700" text-anchor="start">CONCEPT 10.2  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">Synchronization establishes a happens-before</text><text x="32" y="112" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">relation</text><rect x="32" y="160" width="320" height="222" rx="12" fill="#253d40" stroke="#5c6c88" stroke-width="1.5" /><text x="50" y="194" font-size="20" fill="#8ed5c4" font-weight="600" text-anchor="start">Unsafe shared update</text><text x="50" y="250" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">read counter</text><text x="50" y="290" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">modify locally</text><text x="50" y="330" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">store can overwrite another</text><text x="50" y="356" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">update</text><rect x="408" y="160" width="320" height="222" rx="12" fill="#44332e" stroke="#5c6c88" stroke-width="1.5" /><text x="426" y="194" font-size="20" fill="#f3b486" font-weight="600" text-anchor="start">Protected update</text><text x="426" y="250" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">atomic operation or lock</text><text x="426" y="290" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">defined visibility rules</text><text x="426" y="330" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">all increments are accounted</text><text x="426" y="356" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">for</text><rect x="32" y="406" width="696" height="82" rx="12" fill="#253d40" stroke="#426b66" stroke-width="1.5" /><text x="48" y="435" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">A data race is not merely a performance issue; the language does not define</text><text x="48" y="459" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">the program behavior.</text></g></svg>