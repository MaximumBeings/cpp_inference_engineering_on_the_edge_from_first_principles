<svg xmlns="http://www.w3.org/2000/svg" width="760" height="508" viewBox="0 0 760 508" role="img" aria-labelledby="title desc">
<title id="title">Second-order sensitivity weights errors unequally</title><desc id="desc">The quadratic approximation is local and depends on the calibration data and objective.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="506" rx="16" fill="#fbfaf7" stroke="#d8dedb" stroke-width="1.5"/><text x="32" y="36" font-size="13" fill="#0e756d" font-weight="700" text-anchor="start">CONCEPT 30.5  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#182d38" font-weight="600" text-anchor="start">Second-order sensitivity weights errors</text><text x="32" y="112" font-size="27" fill="#182d38" font-weight="600" text-anchor="start">unequally</text><rect x="32" y="160" width="320" height="222" rx="12" fill="#e8f1ed" stroke="#cbd5d8" stroke-width="1.5"/><text x="50" y="194" font-size="20" fill="#0e756d" font-weight="600" text-anchor="start">Equal reconstruction</text><text x="50" y="221" font-size="20" fill="#0e756d" font-weight="600" text-anchor="start">error</text><text x="50" y="250" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">same Euclidean distance</text><text x="50" y="290" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">different directions</text><text x="50" y="330" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">can affect output</text><text x="50" y="356" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">differently</text><rect x="408" y="160" width="320" height="222" rx="12" fill="#faeee6" stroke="#cbd5d8" stroke-width="1.5"/><text x="426" y="194" font-size="20" fill="#b94c27" font-weight="600" text-anchor="start">Hessian-aware objective</text><text x="426" y="250" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">local curvature information</text><text x="426" y="290" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">weighted error directions</text><text x="426" y="330" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">compensate remaining weights</text><rect x="32" y="406" width="696" height="82" rx="12" fill="#eaf2ef" stroke="#d2e1db" stroke-width="1.5"/><text x="48" y="435" font-size="16" fill="#0e756d" font-weight="400" text-anchor="start">The quadratic approximation is local and depends on the calibration data</text><text x="48" y="459" font-size="16" fill="#0e756d" font-weight="400" text-anchor="start">and objective.</text></g></svg>