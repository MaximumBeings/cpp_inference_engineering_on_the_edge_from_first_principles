<svg xmlns="http://www.w3.org/2000/svg" width="760" height="508" viewBox="0 0 760 508" role="img" aria-labelledby="title desc">
<title id="title">GEMV and GEMM reuse the same weights differently</title><desc id="desc">The crossover depends on shape and memory traffic, not just peak arithmetic rate.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993" /></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="506" rx="16" fill="#0b2e63" stroke="#375d8e" stroke-width="1.5" /><text x="32" y="36" font-size="13" fill="#8ed5c4" font-weight="700" text-anchor="start">CONCEPT 30.1  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">GEMV and GEMM reuse the same weights</text><text x="32" y="112" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">differently</text><rect x="32" y="160" width="320" height="222" rx="12" fill="#123e68" stroke="#5b83b5" stroke-width="1.5" /><text x="50" y="194" font-size="20" fill="#8ed5c4" font-weight="600" text-anchor="start">GEMV</text><text x="50" y="250" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">matrix times one vector</text><text x="50" y="290" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">~2*M*N FLOPs</text><text x="50" y="330" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">little reuse across token</text><text x="50" y="356" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">rows</text><rect x="408" y="160" width="320" height="222" rx="12" fill="#214b7b" stroke="#5b83b5" stroke-width="1.5" /><text x="426" y="194" font-size="20" fill="#f3b486" font-weight="600" text-anchor="start">GEMM</text><text x="426" y="250" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">matrix times a batch</text><text x="426" y="290" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">~2*M*N*B FLOPs</text><text x="426" y="330" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">weights reused across B</text><text x="426" y="356" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">vectors</text><rect x="32" y="406" width="696" height="82" rx="12" fill="#123e68" stroke="#467fac" stroke-width="1.5" /><text x="48" y="435" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">The crossover depends on shape and memory traffic, not just peak arithmetic</text><text x="48" y="459" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">rate.</text></g></svg>