<svg xmlns="http://www.w3.org/2000/svg" width="760" height="603" viewBox="0 0 760 603" role="img" aria-labelledby="title desc">
<title id="title">Two four-bit codes share one byte</title><desc id="desc">Nibble order and the signed-value offset are format contracts; they must match the encoder.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="601" rx="16" fill="#fbfaf7" stroke="#d8dedb" stroke-width="1.5"/><text x="32" y="36" font-size="13" fill="#a33516" font-weight="700" text-anchor="start">CONCEPT 4.3  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#182d38" font-weight="600" text-anchor="start">Two four-bit codes share one byte</text><rect x="32" y="196" width="80" height="84" rx="12" fill="#ffe4d6" stroke="#cbd5d8" stroke-width="1.5"/><text x="72" y="248" font-size="23" fill="#a33516" font-weight="600" text-anchor="middle">b7</text><rect x="119" y="196" width="80" height="84" rx="12" fill="#ffe4d6" stroke="#cbd5d8" stroke-width="1.5"/><text x="159" y="248" font-size="23" fill="#a33516" font-weight="600" text-anchor="middle">b6</text><rect x="206" y="196" width="80" height="84" rx="12" fill="#ffe4d6" stroke="#cbd5d8" stroke-width="1.5"/><text x="246" y="248" font-size="23" fill="#a33516" font-weight="600" text-anchor="middle">b5</text><rect x="293" y="196" width="80" height="84" rx="12" fill="#ffe4d6" stroke="#cbd5d8" stroke-width="1.5"/><text x="333" y="248" font-size="23" fill="#a33516" font-weight="600" text-anchor="middle">b4</text><rect x="380" y="196" width="80" height="84" rx="12" fill="#faeee6" stroke="#cbd5d8" stroke-width="1.5"/><text x="420" y="248" font-size="23" fill="#9c3619" font-weight="600" text-anchor="middle">b3</text><rect x="467" y="196" width="80" height="84" rx="12" fill="#faeee6" stroke="#cbd5d8" stroke-width="1.5"/><text x="507" y="248" font-size="23" fill="#9c3619" font-weight="600" text-anchor="middle">b2</text><rect x="554" y="196" width="80" height="84" rx="12" fill="#faeee6" stroke="#cbd5d8" stroke-width="1.5"/><text x="594" y="248" font-size="23" fill="#9c3619" font-weight="600" text-anchor="middle">b1</text><rect x="641" y="196" width="80" height="84" rx="12" fill="#faeee6" stroke="#cbd5d8" stroke-width="1.5"/><text x="681" y="248" font-size="23" fill="#9c3619" font-weight="600" text-anchor="middle">b0</text><text x="206" y="167" font-size="16" fill="#a33516" font-weight="700" text-anchor="middle">HIGH NIBBLE</text><text x="554" y="167" font-size="16" fill="#9c3619" font-weight="700" text-anchor="middle">LOW NIBBLE</text><path d="M206 286 L206 338" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><path d="M554 286 L554 338" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="344" width="320" height="82" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="192" y="391" font-size="20" fill="#182d38" font-weight="500" text-anchor="middle">B = (byte &gt;&gt; 4) &amp; 0x0F</text><rect x="408" y="344" width="320" height="82" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="568" y="391" font-size="20" fill="#182d38" font-weight="500" text-anchor="middle">A = byte &amp; 0x0F</text><text x="32" y="473" font-size="17" fill="#a33516" font-weight="400" text-anchor="start">The scale and signed-value convention belong to the block format.</text><rect x="32" y="501" width="696" height="82" rx="12" fill="#fff0e8" stroke="#e9b9a5" stroke-width="1.5"/><text x="48" y="530" font-size="16" fill="#a33516" font-weight="400" text-anchor="start">Nibble order and the signed-value offset are format contracts; they must</text><text x="48" y="554" font-size="16" fill="#a33516" font-weight="400" text-anchor="start">match the encoder.</text></g></svg>