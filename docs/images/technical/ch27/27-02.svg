<svg xmlns="http://www.w3.org/2000/svg" width="760" height="625" viewBox="0 0 760 625" role="img" aria-labelledby="title desc">
<title id="title">A deadline is an end-to-end constraint</title><desc id="desc">No latency numbers are implied. Measure the complete path under the intended system load.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993" /></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="623" rx="16" fill="#0b2e63" stroke="#375d8e" stroke-width="1.5" /><text x="32" y="36" font-size="13" fill="#8ed5c4" font-weight="700" text-anchor="start">CONCEPT 27.2  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">A deadline is an end-to-end constraint</text><text x="32" y="160" font-size="18" fill="#8ed5c4" font-weight="600" text-anchor="start">Input</text><rect x="32" y="178" width="212" height="72" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="44" y="207" font-size="17" fill="#f5f4fa" font-weight="400" text-anchor="start">receive tick</text><path d="M248 214 L268 214" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><rect x="274" y="178" width="212" height="72" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="286" y="207" font-size="17" fill="#f5f4fa" font-weight="400" text-anchor="start">timestamp</text><path d="M490 214 L510 214" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><rect x="516" y="178" width="212" height="72" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="528" y="207" font-size="17" fill="#f5f4fa" font-weight="400" text-anchor="start">validate freshness</text><text x="32" y="287" font-size="18" fill="#8ed5c4" font-weight="600" text-anchor="start">Compute</text><rect x="32" y="305" width="212" height="72" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="44" y="334" font-size="17" fill="#f5f4fa" font-weight="400" text-anchor="start">extract features</text><path d="M248 341 L268 341" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><rect x="274" y="305" width="212" height="72" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="286" y="334" font-size="17" fill="#f5f4fa" font-weight="400" text-anchor="start">run inference</text><path d="M490 341 L510 341" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><rect x="516" y="305" width="212" height="72" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="528" y="334" font-size="17" fill="#f5f4fa" font-weight="400" text-anchor="start">check elapsed time</text><text x="32" y="414" font-size="18" fill="#8ed5c4" font-weight="600" text-anchor="start">Decision</text><rect x="32" y="432" width="212" height="72" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="44" y="461" font-size="17" fill="#f5f4fa" font-weight="400" text-anchor="start">within deadline</text><path d="M248 468 L268 468" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><rect x="274" y="432" width="212" height="72" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="286" y="461" font-size="17" fill="#f5f4fa" font-weight="400" text-anchor="start">apply policy</text><path d="M490 468 L510 468" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><rect x="516" y="432" width="212" height="72" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="528" y="461" font-size="17" fill="#f5f4fa" font-weight="400" text-anchor="start">otherwise reject</text><text x="528" y="484" font-size="17" fill="#f5f4fa" font-weight="400" text-anchor="start">stale result</text><rect x="32" y="523" width="696" height="82" rx="12" fill="#123e68" stroke="#467fac" stroke-width="1.5" /><text x="48" y="552" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">No latency numbers are implied. Measure the complete path under the</text><text x="48" y="576" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">intended system load.</text></g></svg>