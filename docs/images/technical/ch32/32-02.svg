<svg xmlns="http://www.w3.org/2000/svg" width="760" height="482" viewBox="0 0 760 482" role="img" aria-labelledby="title desc">
<title id="title">Tiling changes intermediate storage, not the target result</title><desc id="desc">The tiled path avoids storing the full score matrix but remains subject to finite-precision differences.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993" /></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="480" rx="16" fill="#181e30" stroke="#3a455c" stroke-width="1.5" /><text x="32" y="36" font-size="13" fill="#8ed5c4" font-weight="700" text-anchor="start">CONCEPT 32.2  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">Tiling changes intermediate storage, not the</text><text x="32" y="112" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">target result</text><rect x="32" y="160" width="320" height="196" rx="12" fill="#253d40" stroke="#5c6c88" stroke-width="1.5" /><text x="50" y="194" font-size="20" fill="#8ed5c4" font-weight="600" text-anchor="start">Materialized attention</text><text x="50" y="250" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">write all N x N scores</text><text x="50" y="290" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">softmax over each row</text><text x="50" y="330" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">multiply probabilities by V</text><rect x="408" y="160" width="320" height="196" rx="12" fill="#44332e" stroke="#5c6c88" stroke-width="1.5" /><text x="426" y="194" font-size="20" fill="#f3b486" font-weight="600" text-anchor="start">Tiled attention</text><text x="426" y="250" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">stream K/V tiles</text><text x="426" y="290" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">keep row statistics m,l,o</text><text x="426" y="330" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">write normalized output</text><rect x="32" y="380" width="696" height="82" rx="12" fill="#253d40" stroke="#426b66" stroke-width="1.5" /><text x="48" y="409" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">The tiled path avoids storing the full score matrix but remains subject to</text><text x="48" y="433" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">finite-precision differences.</text></g></svg>