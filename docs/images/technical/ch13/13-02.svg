<svg xmlns="http://www.w3.org/2000/svg" width="760" height="662" viewBox="0 0 760 662" role="img" aria-labelledby="title desc">
<title id="title">A block table maps logical pages to physical blocks</title><desc id="desc">Logical ordering need not equal physical ordering. Attention resolves each token through the table.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993" /></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="660" rx="16" fill="#0b2e63" stroke="#375d8e" stroke-width="1.5" /><text x="32" y="36" font-size="13" fill="#8ed5c4" font-weight="700" text-anchor="start">CONCEPT 13.2  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">A block table maps logical pages to physical</text><text x="32" y="112" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">blocks</text><rect x="32" y="160" width="220" height="76" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="142" y="205" font-size="20" fill="#f5f4fa" font-weight="500" text-anchor="middle">Logical page 0</text><rect x="32" y="272" width="220" height="76" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="142" y="317" font-size="20" fill="#f5f4fa" font-weight="500" text-anchor="middle">Logical page 1</text><rect x="32" y="384" width="220" height="76" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="142" y="429" font-size="20" fill="#f5f4fa" font-weight="500" text-anchor="middle">Logical page 2</text><rect x="508" y="160" width="220" height="76" rx="12" fill="#123e68" stroke="#5b83b5" stroke-width="1.5" /><text x="618" y="205" font-size="19" fill="#8ed5c4" font-weight="500" text-anchor="middle">Physical block 2</text><rect x="508" y="272" width="220" height="76" rx="12" fill="#123e68" stroke="#5b83b5" stroke-width="1.5" /><text x="618" y="317" font-size="19" fill="#8ed5c4" font-weight="500" text-anchor="middle">Physical block 7</text><rect x="508" y="384" width="220" height="76" rx="12" fill="#123e68" stroke="#5b83b5" stroke-width="1.5" /><text x="618" y="429" font-size="19" fill="#8ed5c4" font-weight="500" text-anchor="middle">Physical block 9</text><path d="M258 198 L502 310" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><path d="M258 310 L502 198" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><path d="M258 422 L502 422" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><text x="32" y="532" font-size="17" fill="#8ed5c4" font-weight="400" text-anchor="start">Block table: [7, 2, 9]. Token offset is retained inside each block.</text><rect x="32" y="560" width="696" height="82" rx="12" fill="#123e68" stroke="#467fac" stroke-width="1.5" /><text x="48" y="589" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">Logical ordering need not equal physical ordering. Attention resolves each</text><text x="48" y="613" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">token through the table.</text></g></svg>