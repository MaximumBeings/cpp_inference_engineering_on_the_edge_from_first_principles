<svg xmlns="http://www.w3.org/2000/svg" width="760" height="578" viewBox="0 0 760 578" role="img" aria-labelledby="title desc">
<title id="title">A ring slot and a RoPE position are different</title><desc id="desc">Wrapping a buffer must not silently reset token positions.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="576" rx="16" fill="#fbfaf7" stroke="#d8dedb" stroke-width="1.5"/><text x="32" y="36" font-size="13" fill="#a33516" font-weight="700" text-anchor="start">CONCEPT 13.3  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#182d38" font-weight="600" text-anchor="start">A ring slot and a RoPE position are different</text><rect x="174.0" y="166.0" width="72" height="48" rx="12" fill="#faeee6" stroke="#cbd5d8" stroke-width="1.5"/><text x="210.0" y="197.0" font-size="15" fill="#182d38" font-weight="600" text-anchor="middle">slot 0</text><rect x="253.19595949289334" y="198.8040405071067" width="72" height="48" rx="12" fill="#ffe4d6" stroke="#cbd5d8" stroke-width="1.5"/><text x="289.19595949289334" y="229.8040405071067" font-size="15" fill="#182d38" font-weight="600" text-anchor="middle">slot 1</text><rect x="286.0" y="278.0" width="72" height="48" rx="12" fill="#ffe4d6" stroke="#cbd5d8" stroke-width="1.5"/><text x="322.0" y="309.0" font-size="15" fill="#182d38" font-weight="600" text-anchor="middle">slot 2</text><rect x="253.19595949289334" y="357.1959594928933" width="72" height="48" rx="12" fill="#ffe4d6" stroke="#cbd5d8" stroke-width="1.5"/><text x="289.19595949289334" y="388.1959594928933" font-size="15" fill="#182d38" font-weight="600" text-anchor="middle">slot 3</text><rect x="174.0" y="390.0" width="72" height="48" rx="12" fill="#ffe4d6" stroke="#cbd5d8" stroke-width="1.5"/><text x="210.0" y="421.0" font-size="15" fill="#182d38" font-weight="600" text-anchor="middle">slot 4</text><rect x="94.80404050710669" y="357.19595949289334" width="72" height="48" rx="12" fill="#ffe4d6" stroke="#cbd5d8" stroke-width="1.5"/><text x="130.8040405071067" y="388.19595949289334" font-size="15" fill="#182d38" font-weight="600" text-anchor="middle">slot 5</text><rect x="62.0" y="278.0" width="72" height="48" rx="12" fill="#ffe4d6" stroke="#cbd5d8" stroke-width="1.5"/><text x="98.0" y="309.0" font-size="15" fill="#182d38" font-weight="600" text-anchor="middle">slot 6</text><rect x="94.80404050710666" y="198.8040405071067" width="72" height="48" rx="12" fill="#ffe4d6" stroke="#cbd5d8" stroke-width="1.5"/><text x="130.80404050710666" y="229.8040405071067" font-size="15" fill="#182d38" font-weight="600" text-anchor="middle">slot 7</text><text x="210" y="300" font-size="16" fill="#a33516" font-weight="600" text-anchor="middle">PHYSICAL</text><text x="210" y="326" font-size="16" fill="#a33516" font-weight="600" text-anchor="middle">SLOTS</text><text x="400" y="208" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">logical positions keep</text><text x="400" y="233" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">increasing</text><text x="400" y="273" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">position 8 -&gt; slot 0</text><text x="400" y="338" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">position 9 -&gt; slot 1</text><text x="400" y="403" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">position 10 -&gt; slot 2</text><text x="32" y="470" font-size="17" fill="#a33516" font-weight="400" text-anchor="start">Slot reuse does not imply reusing the old positional encoding.</text><rect x="32" y="500" width="696" height="58" rx="12" fill="#fff0e8" stroke="#e9b9a5" stroke-width="1.5"/><text x="48" y="529" font-size="16" fill="#a33516" font-weight="400" text-anchor="start">Wrapping a buffer must not silently reset token positions.</text></g></svg>