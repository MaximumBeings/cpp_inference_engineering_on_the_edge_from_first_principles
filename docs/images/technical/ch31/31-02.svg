<svg xmlns="http://www.w3.org/2000/svg" width="760" height="625" viewBox="0 0 760 625" role="img" aria-labelledby="title desc">
<title id="title">Chunked prefill creates scheduling boundaries</title><desc id="desc">Chunk size trades prefill progress against decode delay. The schedule is illustrative.</desc>
