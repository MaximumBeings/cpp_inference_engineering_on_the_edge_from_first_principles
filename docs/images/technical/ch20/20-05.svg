<svg xmlns="http://www.w3.org/2000/svg" width="760" height="482" viewBox="0 0 760 482" role="img" aria-labelledby="title desc">
<title id="title">Occlusion reveals sensitivity, not causal truth</title><desc id="desc">A changed output indicates sensitivity to the perturbation. It does not establish clinical explainability.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="480" rx="16" fill="#fbfaf7" stroke="#d8dedb" stroke-width="1.5"/><text x="32" y="36" font-size="13" fill="#a33516" font-weight="700" text-anchor="start">CONCEPT 20.5  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#182d38" font-weight="600" text-anchor="start">Occlusion reveals sensitivity, not causal</text><text x="32" y="112" font-size="27" fill="#182d38" font-weight="600" text-anchor="start">truth</text><rect x="32" y="160" width="320" height="196" rx="12" fill="#ffe4d6" stroke="#cbd5d8" stroke-width="1.5"/><text x="50" y="194" font-size="20" fill="#a33516" font-weight="600" text-anchor="start">Original image</text><text x="50" y="250" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">baseline model output</text><text x="50" y="290" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">record selected score</text><text x="50" y="330" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">preserve context</text><rect x="408" y="160" width="320" height="196" rx="12" fill="#faeee6" stroke="#cbd5d8" stroke-width="1.5"/><text x="426" y="194" font-size="20" fill="#9c3619" font-weight="600" text-anchor="start">Occluded region</text><text x="426" y="250" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">rerun with masked region</text><text x="426" y="290" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">compare output change</text><text x="426" y="330" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">interpret cautiously</text><rect x="32" y="380" width="696" height="82" rx="12" fill="#fff0e8" stroke="#e9b9a5" stroke-width="1.5"/><text x="48" y="409" font-size="16" fill="#a33516" font-weight="400" text-anchor="start">A changed output indicates sensitivity to the perturbation. It does not</text><text x="48" y="433" font-size="16" fill="#a33516" font-weight="400" text-anchor="start">establish clinical explainability.</text></g></svg>