<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
<title id="title">Choose precision under an explicit budget</title><desc id="desc">The smallest format is not automatically the best choice. The stored type must have a supported kernel.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993" /></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="458" rx="16" fill="#0b2e63" stroke="#375d8e" stroke-width="1.5" /><text x="32" y="36" font-size="13" fill="#8ed5c4" font-weight="700" text-anchor="start">CONCEPT C.1  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">Choose precision under an explicit budget</text><rect x="32" y="138" width="320" height="196" rx="12" fill="#123e68" stroke="#5b83b5" stroke-width="1.5" /><text x="50" y="172" font-size="20" fill="#8ed5c4" font-weight="600" text-anchor="start">Capacity constraint</text><text x="50" y="228" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">count encoded tensor bytes</text><text x="50" y="268" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">include scales and metadata</text><text x="50" y="308" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">check acceptable task error</text><rect x="408" y="138" width="320" height="196" rx="12" fill="#214b7b" stroke="#5b83b5" stroke-width="1.5" /><text x="426" y="172" font-size="20" fill="#f3b486" font-weight="600" text-anchor="start">Sensitivity constraint</text><text x="426" y="228" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">identify sensitive tensors</text><text x="426" y="268" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">keep more precision there</text><text x="426" y="308" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">validate the hybrid policy</text><rect x="32" y="358" width="696" height="82" rx="12" fill="#123e68" stroke="#467fac" stroke-width="1.5" /><text x="48" y="387" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">The smallest format is not automatically the best choice. The stored type</text><text x="48" y="411" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">must have a supported kernel.</text></g></svg>