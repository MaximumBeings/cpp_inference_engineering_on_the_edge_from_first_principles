<svg xmlns="http://www.w3.org/2000/svg" width="760" height="638" viewBox="0 0 760 638" role="img" aria-labelledby="title desc">
<title id="title">Select the cache policy for the actual constraint</title><desc id="desc">Every policy must preserve the supported model behavior, logical positions and storage lifetime contract.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993" /></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="636" rx="16" fill="#181e30" stroke="#3a455c" stroke-width="1.5" /><text x="32" y="36" font-size="13" fill="#8ed5c4" font-weight="700" text-anchor="start">CONCEPT C.3  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">Select the cache policy for the actual</text><text x="32" y="112" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">constraint</text><rect x="32" y="160" width="286" height="74" rx="12" fill="#26324a" stroke="#5c6c88" stroke-width="1.5" /><rect x="408" y="160" width="320" height="74" rx="12" fill="#253d40" stroke="#5c6c88" stroke-width="1.5" /><text x="48" y="191" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">Capacity pressure</text><text x="424" y="191" font-size="18" fill="#8ed5c4" font-weight="400" text-anchor="start">windowing or compression</text><path d="M322 197 L402 197" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><rect x="32" y="252" width="286" height="74" rx="12" fill="#26324a" stroke="#5c6c88" stroke-width="1.5" /><rect x="408" y="252" width="320" height="74" rx="12" fill="#253d40" stroke="#5c6c88" stroke-width="1.5" /><text x="48" y="283" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">Repeated prompts</text><text x="424" y="283" font-size="18" fill="#8ed5c4" font-weight="400" text-anchor="start">prefix sharing</text><path d="M322 289 L402 289" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><rect x="32" y="344" width="286" height="74" rx="12" fill="#26324a" stroke="#5c6c88" stroke-width="1.5" /><rect x="408" y="344" width="320" height="74" rx="12" fill="#253d40" stroke="#5c6c88" stroke-width="1.5" /><text x="48" y="375" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">Variable request lengths</text><text x="424" y="375" font-size="18" fill="#8ed5c4" font-weight="400" text-anchor="start">paged allocation</text><path d="M322 381 L402 381" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><rect x="32" y="436" width="286" height="74" rx="12" fill="#26324a" stroke="#5c6c88" stroke-width="1.5" /><rect x="408" y="436" width="320" height="74" rx="12" fill="#253d40" stroke="#5c6c88" stroke-width="1.5" /><text x="48" y="467" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">Token importance</text><text x="424" y="467" font-size="18" fill="#8ed5c4" font-weight="400" text-anchor="start">explicit eviction policy</text><path d="M322 473 L402 473" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><rect x="32" y="536" width="696" height="82" rx="12" fill="#253d40" stroke="#426b66" stroke-width="1.5" /><text x="48" y="565" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">Every policy must preserve the supported model behavior, logical positions</text><text x="48" y="589" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">and storage lifetime contract.</text></g></svg>