<svg xmlns="http://www.w3.org/2000/svg" width="760" height="625" viewBox="0 0 760 625" role="img" aria-labelledby="title desc">
<title id="title">Compare claimed timing with available evidence</title><desc id="desc">Editable metadata is evidence with limits. A mismatch requires explanation, not an automatic accusation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="623" rx="16" fill="#fbfaf7" stroke="#d8dedb" stroke-width="1.5"/><text x="32" y="36" font-size="13" fill="#a33516" font-weight="700" text-anchor="start">CONCEPT 28.2  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#182d38" font-weight="600" text-anchor="start">Compare claimed timing with available evidence</text><text x="32" y="160" font-size="18" fill="#a33516" font-weight="600" text-anchor="start">Claim record</text><rect x="32" y="178" width="212" height="72" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="44" y="207" font-size="17" fill="#182d38" font-weight="400" text-anchor="start">incident date</text><path d="M248 214 L268 214" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><rect x="274" y="178" width="212" height="72" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="286" y="207" font-size="17" fill="#182d38" font-weight="400" text-anchor="start">declared timezone</text><path d="M490 214 L510 214" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><rect x="516" y="178" width="212" height="72" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="528" y="207" font-size="17" fill="#182d38" font-weight="400" text-anchor="start">supporting context</text><text x="32" y="287" font-size="18" fill="#a33516" font-weight="600" text-anchor="start">Photo metadata</text><rect x="32" y="305" width="212" height="72" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="44" y="334" font-size="17" fill="#182d38" font-weight="400" text-anchor="start">capture timestamp</text><path d="M248 341 L268 341" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><rect x="274" y="305" width="212" height="72" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="286" y="334" font-size="17" fill="#182d38" font-weight="400" text-anchor="start">possible edits</text><path d="M490 341 L510 341" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><rect x="516" y="305" width="212" height="72" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="528" y="334" font-size="17" fill="#182d38" font-weight="400" text-anchor="start">missing metadata</text><text x="32" y="414" font-size="18" fill="#a33516" font-weight="600" text-anchor="start">Review</text><rect x="32" y="432" width="212" height="72" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="44" y="461" font-size="17" fill="#182d38" font-weight="400" text-anchor="start">normalize time</text><path d="M248 468 L268 468" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><rect x="274" y="432" width="212" height="72" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="286" y="461" font-size="17" fill="#182d38" font-weight="400" text-anchor="start">check consistency</text><path d="M490 468 L510 468" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><rect x="516" y="432" width="212" height="72" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="528" y="461" font-size="17" fill="#182d38" font-weight="400" text-anchor="start">record uncertainty</text><rect x="32" y="523" width="696" height="82" rx="12" fill="#fff0e8" stroke="#e9b9a5" stroke-width="1.5"/><text x="48" y="552" font-size="16" fill="#a33516" font-weight="400" text-anchor="start">Editable metadata is evidence with limits. A mismatch requires explanation,</text><text x="48" y="576" font-size="16" fill="#a33516" font-weight="400" text-anchor="start">not an automatic accusation.</text></g></svg>