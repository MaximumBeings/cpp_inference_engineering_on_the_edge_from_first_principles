<svg xmlns="http://www.w3.org/2000/svg" width="760" height="684" viewBox="0 0 760 684" role="img" aria-labelledby="title desc">
<title id="title">Monitor transactions with explicit windows</title><desc id="desc">Aggregate event history before combining anomaly signals. An alert needs contextual review; thresholds alone cannot establish money laundering.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993" /></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="682" rx="16" fill="#181e30" stroke="#3a455c" stroke-width="1.5" /><text x="32" y="36" font-size="13" fill="#8ed5c4" font-weight="700" text-anchor="start">C++ INFERENCE AT THE EDGE  /  OVERVIEW</text><text x="32" y="78" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">Monitor transactions with explicit windows</text><text x="32" y="116" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">Aggregate event history before combining anomaly signals.</text><rect x="32" y="158" width="320" height="184" rx="12" fill="#26324a" stroke="#5c6c88" stroke-width="1.5" /><text x="50" y="185" font-size="13" fill="#f3b486" font-weight="700" text-anchor="start">01</text><text x="50" y="217" font-size="21" fill="#f5f4fa" font-weight="600" text-anchor="start">Transaction</text><text x="50" y="271" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">Account, amount, time and</text><text x="50" y="296" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">place</text><rect x="408" y="158" width="320" height="184" rx="12" fill="#26324a" stroke="#5c6c88" stroke-width="1.5" /><text x="426" y="185" font-size="13" fill="#f3b486" font-weight="700" text-anchor="start">02</text><text x="426" y="217" font-size="21" fill="#f5f4fa" font-weight="600" text-anchor="start">Window state</text><text x="426" y="271" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">Velocity and rolling totals</text><rect x="408" y="372" width="320" height="184" rx="12" fill="#26324a" stroke="#5c6c88" stroke-width="1.5" /><text x="426" y="399" font-size="13" fill="#f3b486" font-weight="700" text-anchor="start">03</text><text x="426" y="431" font-size="21" fill="#f5f4fa" font-weight="600" text-anchor="start">Combine signals</text><text x="426" y="485" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">Structuring and travel</text><text x="426" y="510" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">checks</text><rect x="32" y="372" width="320" height="184" rx="12" fill="#26324a" stroke="#5c6c88" stroke-width="1.5" /><text x="50" y="399" font-size="13" fill="#f3b486" font-weight="700" text-anchor="start">04</text><text x="50" y="431" font-size="21" fill="#f5f4fa" font-weight="600" text-anchor="start">Review queue</text><text x="50" y="485" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">Record the alert and</text><text x="50" y="510" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">evidence</text><path d="M356 236 L402 236" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><path d="M568 346 L568 366" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><path d="M404 450 L358 450" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><rect x="32" y="582" width="696" height="82" rx="12" fill="#253d40" stroke="#426b66" stroke-width="1.5" /><text x="48" y="611" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">An alert needs contextual review; thresholds alone cannot establish money</text><text x="48" y="635" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">laundering.</text></g></svg>