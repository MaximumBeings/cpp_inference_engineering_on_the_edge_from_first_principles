<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
<title id="title">Connect the math to kernel behavior</title><desc id="desc">Derivations should predict the quantities the implementation measures.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#738993"/></marker></defs>
<g font-family="Roboto, Arial, sans-serif"><rect x="1" y="1" width="1118" height="468" rx="18" fill="#fbfaf7" stroke="#d8dedb" stroke-width="1.5"/>
<path d="M32 38 H74" stroke="#bd591c" stroke-width="5" stroke-linecap="round"/>
<text x="32" y="83" font-size="29" fill="#182d38" font-weight="400">Connect the math to kernel behavior</text>
<text x="32" y="124" font-size="18" fill="#526674" font-weight="400">Derivations should predict the quantities the implementation measures.</text>
<rect x="32" y="183" width="246" height="145" rx="14" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><path d="M33 202 V309" stroke="#0e756d" stroke-width="4"/><text x="49" y="219" font-size="22" fill="#182d38" font-weight="400">FLOPs and bytes</text><text x="49" y="270" font-size="17" fill="#526674" font-weight="400">Count arithmetic and</text><text x="49" y="295" font-size="17" fill="#526674" font-weight="400">traffic</text><path d="M279 255 H298" stroke="#738993" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/><rect x="302" y="183" width="246" height="145" rx="14" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><path d="M303 202 V309" stroke="#bd591c" stroke-width="4"/><text x="319" y="219" font-size="22" fill="#182d38" font-weight="400">Numerical stability</text><text x="319" y="270" font-size="17" fill="#526674" font-weight="400">Track error and finite</text><text x="319" y="295" font-size="17" fill="#526674" font-weight="400">values</text><path d="M549 255 H568" stroke="#738993" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/><rect x="572" y="183" width="246" height="145" rx="14" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><path d="M573 202 V309" stroke="#0e756d" stroke-width="4"/><text x="589" y="219" font-size="22" fill="#182d38" font-weight="400">Geometry</text><text x="589" y="270" font-size="17" fill="#526674" font-weight="400">Rotations and relative</text><text x="589" y="295" font-size="17" fill="#526674" font-weight="400">position</text><path d="M819 255 H838" stroke="#738993" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/><rect x="842" y="183" width="246" height="145" rx="14" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><path d="M843 202 V309" stroke="#bd591c" stroke-width="4"/><text x="859" y="219" font-size="22" fill="#182d38" font-weight="400">Sensitivity</text><text x="859" y="270" font-size="17" fill="#526674" font-weight="400">Curvature and</text><text x="859" y="295" font-size="17" fill="#526674" font-weight="400">quantization error</text><rect x="32" y="360" width="1056" height="78" rx="12" fill="#edf3f1" stroke="#d7e3de" stroke-width="1.5"/><text x="50" y="392" font-size="19" fill="#0e756d" font-weight="400">Use the mathematical assumptions explicitly when interpreting measurements.</text></g></svg>