<svg xmlns="http://www.w3.org/2000/svg" width="760" height="660" viewBox="0 0 760 660" role="img" aria-labelledby="title desc">
<title id="title">Connect the math to kernel behavior</title><desc id="desc">Derivations should predict the quantities the implementation measures. Use the mathematical assumptions explicitly when interpreting measurements.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993" /></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="658" rx="16" fill="#0b2e63" stroke="#375d8e" stroke-width="1.5" /><text x="32" y="36" font-size="13" fill="#8ed5c4" font-weight="700" text-anchor="start">C++ INFERENCE AT THE EDGE  /  OVERVIEW</text><text x="32" y="78" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">Connect the math to kernel behavior</text><text x="32" y="116" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">Derivations should predict the quantities the implementation measures.</text><rect x="32" y="158" width="320" height="184" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="50" y="185" font-size="13" fill="#f3b486" font-weight="700" text-anchor="start">01</text><text x="50" y="217" font-size="21" fill="#f5f4fa" font-weight="600" text-anchor="start">FLOPs and bytes</text><text x="50" y="271" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">Count arithmetic and traffic</text><rect x="408" y="158" width="320" height="184" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="426" y="185" font-size="13" fill="#f3b486" font-weight="700" text-anchor="start">02</text><text x="426" y="217" font-size="21" fill="#f5f4fa" font-weight="600" text-anchor="start">Numerical stability</text><text x="426" y="271" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">Track error and finite</text><text x="426" y="296" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">values</text><rect x="408" y="372" width="320" height="184" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="426" y="399" font-size="13" fill="#f3b486" font-weight="700" text-anchor="start">03</text><text x="426" y="431" font-size="21" fill="#f5f4fa" font-weight="600" text-anchor="start">Geometry</text><text x="426" y="485" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">Rotations and relative</text><text x="426" y="510" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">position</text><rect x="32" y="372" width="320" height="184" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="50" y="399" font-size="13" fill="#f3b486" font-weight="700" text-anchor="start">04</text><text x="50" y="431" font-size="21" fill="#f5f4fa" font-weight="600" text-anchor="start">Sensitivity</text><text x="50" y="485" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">Curvature and quantization</text><text x="50" y="510" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">error</text><path d="M356 236 L402 236" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><path d="M568 346 L568 366" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><path d="M404 450 L358 450" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><rect x="32" y="582" width="696" height="58" rx="12" fill="#123e68" stroke="#467fac" stroke-width="1.5" /><text x="48" y="611" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">Use the mathematical assumptions explicitly when interpreting measurements.</text></g></svg>