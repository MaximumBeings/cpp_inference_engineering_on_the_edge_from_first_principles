<svg xmlns="http://www.w3.org/2000/svg" width="760" height="684" viewBox="0 0 760 684" role="img" aria-labelledby="title desc">
<title id="title">Verify a point-of-sale claim against evidence</title><desc id="desc">Reconciliation compares independent signals before making a disposition. An anomaly is a review signal; it does not by itself prove counterfeit or fraud.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="682" rx="16" fill="#fbfaf7" stroke="#d8dedb" stroke-width="1.5"/><text x="32" y="36" font-size="13" fill="#0e756d" font-weight="700" text-anchor="start">C++ INFERENCE AT THE EDGE  /  OVERVIEW</text><text x="32" y="78" font-size="27" fill="#182d38" font-weight="600" text-anchor="start">Verify a point-of-sale claim against evidence</text><text x="32" y="116" font-size="18" fill="#526674" font-weight="400" text-anchor="start">Reconciliation compares independent signals before making a disposition.</text><rect x="32" y="158" width="320" height="184" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="50" y="185" font-size="13" fill="#b94c27" font-weight="700" text-anchor="start">01</text><text x="50" y="217" font-size="21" fill="#182d38" font-weight="600" text-anchor="start">Capture item</text><text x="50" y="271" font-size="18" fill="#526674" font-weight="400" text-anchor="start">Photo, receipt or document</text><rect x="408" y="158" width="320" height="184" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="426" y="185" font-size="13" fill="#b94c27" font-weight="700" text-anchor="start">02</text><text x="426" y="217" font-size="21" fill="#182d38" font-weight="600" text-anchor="start">Extract signals</text><text x="426" y="271" font-size="18" fill="#526674" font-weight="400" text-anchor="start">Visual features and fields</text><rect x="408" y="372" width="320" height="184" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="426" y="399" font-size="13" fill="#b94c27" font-weight="700" text-anchor="start">03</text><text x="426" y="431" font-size="21" fill="#182d38" font-weight="600" text-anchor="start">Cross-check</text><text x="426" y="485" font-size="18" fill="#526674" font-weight="400" text-anchor="start">Transaction and policy</text><text x="426" y="510" font-size="18" fill="#526674" font-weight="400" text-anchor="start">context</text><rect x="32" y="372" width="320" height="184" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="50" y="399" font-size="13" fill="#b94c27" font-weight="700" text-anchor="start">04</text><text x="50" y="431" font-size="21" fill="#182d38" font-weight="600" text-anchor="start">Escalate or record</text><text x="50" y="485" font-size="18" fill="#526674" font-weight="400" text-anchor="start">Retain the evidence trail</text><path d="M356 236 L402 236" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><path d="M568 346 L568 366" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><path d="M404 450 L358 450" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="582" width="696" height="82" rx="12" fill="#eaf2ef" stroke="#d2e1db" stroke-width="1.5"/><text x="48" y="611" font-size="16" fill="#0e756d" font-weight="400" text-anchor="start">An anomaly is a review signal; it does not by itself prove counterfeit or</text><text x="48" y="635" font-size="16" fill="#0e756d" font-weight="400" text-anchor="start">fraud.</text></g></svg>