t-size="18" fill="#526674" font-weight="400" text-anchor="start">state</text><rect x="32" y="398" width="320" height="184" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="50" y="425" font-size="13" fill="#b94c27" font-weight="700" text-anchor="start">04</text><text x="50" y="457" font-size="21" fill="#182d38" font-weight="600" text-anchor="start">Next token</text><text x="50" y="511" font-size="18" fill="#526674" font-weight="400" text-anchor="start">Sampling and text decoding</text><path d="M356 262 L402 262" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><path d="M568 372 L568 392" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><path d="M404 476 L358 476" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="608" width="696" height="58" rx="12" fill="#eaf2ef" stroke="#d2e1db" stroke-width="1.5"/><text x="48" y="637" font-size="16" fill="#0e756d" font-weight="400" text-anchor="start">Memory budget = weights + KV cache + activations + runtime overhead</text></g></svg>