<svg xmlns="http://www.w3.org/2000/svg" width="760" height="686" viewBox="0 0 760 686" role="img" aria-labelledby="title desc">
<title id="title">From model bytes to the next token</title><desc id="desc">An edge engine must fit weights, live state and working memory on the device. Memory budget = weights + KV cache + activations + runtime overhead</desc>
