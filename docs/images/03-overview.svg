<svg xmlns="http://www.w3.org/2000/svg" width="760" height="686" viewBox="0 0 760 686" role="img" aria-labelledby="title desc">
<title id="title">Inside a transformer block</title><desc id="desc">Residual paths carry the input around attention and the feed-forward network. Attention(Q, K, V) = softmax(QKᵀ / √d) V</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993" /></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="684" rx="16" fill="#181e30" stroke="#3a455c" stroke-width="1.5" /><text x="32" y="36" font-size="13" fill="#8ed5c4" font-weight="700" text-anchor="start">C++ INFERENCE AT THE EDGE  /  OVERVIEW</text><text x="32" y="78" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">Inside a transformer block</text><text x="32" y="116" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">Residual paths carry the input around attention and the feed-forward</text><text x="32" y="142" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">network.</text><rect x="32" y="184" width="320" height="184" rx="12" fill="#26324a" stroke="#5c6c88" stroke-width="1.5" /><text x="50" y="211" font-size="13" fill="#f3b486" font-weight="700" text-anchor="start">01</text><text x="50" y="243" font-size="21" fill="#f5f4fa" font-weight="600" text-anchor="start">Normalize</text><text x="50" y="297" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">RMSNorm scales features</text><rect x="408" y="184" width="320" height="184" rx="12" fill="#26324a" stroke="#5c6c88" stroke-width="1.5" /><text x="426" y="211" font-size="13" fill="#f3b486" font-weight="700" text-anchor="start">02</text><text x="426" y="243" font-size="21" fill="#f5f4fa" font-weight="600" text-anchor="start">Attend</text><text x="426" y="297" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">RoPE, Q/K/V and KV state</text><rect x="408" y="398" width="320" height="184" rx="12" fill="#26324a" stroke="#5c6c88" stroke-width="1.5" /><text x="426" y="425" font-size="13" fill="#f3b486" font-weight="700" text-anchor="start">03</text><text x="426" y="457" font-size="21" fill="#f5f4fa" font-weight="600" text-anchor="start">Add residual</text><text x="426" y="511" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">Combine attention with input</text><rect x="32" y="398" width="320" height="184" rx="12" fill="#26324a" stroke="#5c6c88" stroke-width="1.5" /><text x="50" y="425" font-size="13" fill="#f3b486" font-weight="700" text-anchor="start">04</text><text x="50" y="457" font-size="21" fill="#f5f4fa" font-weight="600" text-anchor="start">Feed forward</text><text x="50" y="511" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">RMSNorm, SwiGLU, residual</text><path d="M356 262 L402 262" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><path d="M568 372 L568 392" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><path d="M404 476 L358 476" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><rect x="32" y="608" width="696" height="58" rx="12" fill="#253d40" stroke="#426b66" stroke-width="1.5" /><text x="48" y="637" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">Attention(Q, K, V) = softmax(QKᵀ / √d) V</text></g></svg>