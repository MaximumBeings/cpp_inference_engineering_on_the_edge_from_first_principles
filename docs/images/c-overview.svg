<svg xmlns="http://www.w3.org/2000/svg" width="760" height="694" viewBox="0 0 760 694" role="img" aria-labelledby="title desc">
<title id="title">Choose an optimization from the limiting resource</title><desc id="desc">Measure the bottleneck before specializing the implementation. Each optimization must preserve the model’s numerical and state contracts.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993" /></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="692" rx="16" fill="#181e30" stroke="#3a455c" stroke-width="1.5" /><text x="32" y="36" font-size="13" fill="#8ed5c4" font-weight="700" text-anchor="start">C++ INFERENCE AT THE EDGE  /  OVERVIEW</text><text x="32" y="78" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">Choose an optimization from the limiting</text><text x="32" y="112" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">resource</text><text x="32" y="150" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">Measure the bottleneck before specializing the implementation.</text><rect x="32" y="192" width="320" height="184" rx="12" fill="#26324a" stroke="#5c6c88" stroke-width="1.5" /><text x="50" y="219" font-size="13" fill="#f3b486" font-weight="700" text-anchor="start">01</text><text x="50" y="251" font-size="21" fill="#f5f4fa" font-weight="600" text-anchor="start">Memory capacity</text><text x="50" y="305" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">Weights and KV must fit</text><rect x="408" y="192" width="320" height="184" rx="12" fill="#26324a" stroke="#5c6c88" stroke-width="1.5" /><text x="426" y="219" font-size="13" fill="#f3b486" font-weight="700" text-anchor="start">02</text><text x="426" y="251" font-size="21" fill="#f5f4fa" font-weight="600" text-anchor="start">Memory traffic</text><text x="426" y="305" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">Decode and cache reuse</text><rect x="408" y="406" width="320" height="184" rx="12" fill="#26324a" stroke="#5c6c88" stroke-width="1.5" /><text x="426" y="433" font-size="13" fill="#f3b486" font-weight="700" text-anchor="start">03</text><text x="426" y="465" font-size="21" fill="#f5f4fa" font-weight="600" text-anchor="start">Compute budget</text><text x="426" y="519" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">SIMD and parallel work</text><rect x="32" y="406" width="320" height="184" rx="12" fill="#26324a" stroke="#5c6c88" stroke-width="1.5" /><text x="50" y="433" font-size="13" fill="#f3b486" font-weight="700" text-anchor="start">04</text><text x="50" y="465" font-size="21" fill="#f5f4fa" font-weight="600" text-anchor="start">Serving state</text><text x="50" y="519" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">Windowing and scheduling</text><path d="M356 270 L402 270" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><path d="M568 380 L568 400" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><path d="M404 484 L358 484" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><rect x="32" y="616" width="696" height="58" rx="12" fill="#253d40" stroke="#426b66" stroke-width="1.5" /><text x="48" y="645" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">Each optimization must preserve the model’s numerical and state contracts.</text></g></svg>