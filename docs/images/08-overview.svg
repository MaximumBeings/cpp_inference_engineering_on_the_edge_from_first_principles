<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
<title id="title">The roofline bounds attainable throughput</title><desc id="desc">Operational intensity determines whether memory bandwidth or compute limits a kernel.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#738993"/></marker></defs>
<g font-family="Roboto, Arial, sans-serif"><rect x="1" y="1" width="1118" height="468" rx="18" fill="#fbfaf7" stroke="#d8dedb" stroke-width="1.5"/>
<path d="M32 38 H74" stroke="#bd591c" stroke-width="5" stroke-linecap="round"/>
<text x="32" y="83" font-size="29" fill="#182d38" font-weight="400">The roofline bounds attainable throughput</text>
<text x="32" y="124" font-size="18" fill="#526674" font-weight="400">Operational intensity determines whether memory bandwidth or compute limits a kernel.</text>
<path d="M80 352 V182 M80 352 H648" stroke="#738993" stroke-width="2"/><path d="M105 334 L362 211 H638" fill="none" stroke="#0e756d" stroke-width="5"/><text x="120" y="311" font-size="18" fill="#182d38" font-weight="400">Bandwidth bound</text><text x="392" y="196" font-size="18" fill="#182d38" font-weight="400">Compute ceiling</text><text x="220" y="395" font-size="19" fill="#182d38" font-weight="400">Operational intensity (FLOPs / byte)</text><text x="86" y="171" font-size="18" fill="#182d38" font-weight="400">Attainable FLOP/s</text><rect x="706" y="185" width="350" height="180" rx="14" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="728" y="221" font-size="24" fill="#182d38" font-weight="600">Two limits</text><text x="728" y="258" font-size="19" fill="#182d38" font-weight="400">Throughput ≤ bandwidth × I</text><text x="728" y="309" font-size="19" fill="#182d38" font-weight="400">Throughput ≤ peak compute</text><text x="80" y="437" font-size="17" fill="#526674" font-weight="400">Schematic axes show the limiting regimes; no measured timings are implied.</text></g></svg>