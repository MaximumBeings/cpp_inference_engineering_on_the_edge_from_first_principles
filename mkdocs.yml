site_name: C++ Inference Engineering on the Edge — Under Development
site_description: Building LLM and Vision-Language Inference Systems in C++23, From First Principles
site_author: Oluwaseyi Awoga
copyright: Copyright &copy; 2026 Oluwaseyi Awoga

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    logo: material/chip

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - footnotes

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - "Part 0 -- Foundations":
      - "2. The Tensor Engine: std::mdspan, Arena Allocators, and Mixed Precision": part0/02-the-tensor-engine.md
      - "3. The Computational Graph: RMSNorm, SwiGLU, RoPE, and Attention": part0/03-the-computational-graph.md
  - "Part 1 -- Shrinking the Model: Quantization for Constrained Memory":
      - "4. Quantization Strategies: Affine Math, Symmetric vs. Asymmetric, Blockwise Scales": part1/04-quantization-strategies.md
      - "5. Model File Formats: GGUF, SafeTensors, and Memory-Mapped Loading": part1/05-model-file-formats.md

extra:
  social: []
