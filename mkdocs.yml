site_name: C++ Inference Engineering on the Edge — Under Development
site_description: Building LLM and Vision-Language Inference Systems in C++23, From First Principles
site_author: Oluwaseyi Awoga
copyright: Copyright &copy; 2026 Oluwaseyi Awoga

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    logo: material/chip

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - footnotes

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - "Part 0 -- Foundations":
      - "2. The Tensor Engine: std::mdspan, Arena Allocators, and Mixed Precision": part0/02-the-tensor-engine.md
      - "3. The Computational Graph: RMSNorm, SwiGLU, RoPE, and Attention": part0/03-the-computational-graph.md
  - "Part 1 -- Shrinking the Model: Quantization for Constrained Memory":
      - "4. Quantization Strategies: Affine Math, Symmetric vs. Asymmetric, Blockwise Scales": part1/04-quantization-strategies.md
      - "5. Model File Formats: GGUF, SafeTensors, and Memory-Mapped Loading": part1/05-model-file-formats.md
      - "6. The Hybrid Quantized Engine: Mixing Precisions for Different Jobs": part1/06-hybrid-quantized-engine.md
      - "7. TurboQuant: Online Vector Quantization with Near-Optimal Distortion": part1/07-turboquant.md
  - "Part 2 -- Performance on the Metal: SIMD, Cache, and Threads":
      - "8. The Memory Wall and the Roofline Model": part2/08-memory-wall-and-roofline-model.md
      - "9. SIMD Vectorization: AVX2 on x86, NEON on Arm": part2/09-simd-vectorization-avx2-neon.md
      - "10. Threading and Concurrency: Real Threads, Verified Without a Clock": part2/10-threading-and-concurrency.md
      - "11. Parallelizing the Forward Pass: Row-Parallel, Head-Parallel, and Reproducible Across Thread Counts": part2/11-parallelizing-the-forward-pass.md
  - "Part 3 -- Serving State: Tokenization and the KV Cache":
      - "12. The Tokenizer: BPE, SentencePiece, and the Vocabulary Pipeline": part3/12-the-tokenizer.md
      - "13. The KV Cache Manager: Paged Attention, Ring Buffers, and Smart Eviction": part3/13-the-kv-cache-manager.md
      - "14. Advanced KV Cache Management: Sliding Windows, Streaming Re-Quantization, and Prefix Caching": part3/14-advanced-kv-cache-management.md
  - "Part 4 -- From Model to Binary: Real Weights, Real Models, Production Engines":
      - "15. Running Real Models: From HuggingFace to First Token with Qwen2.5": part4/15-running-real-models.md

extra:
  social: []
