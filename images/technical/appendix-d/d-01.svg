<svg xmlns="http://www.w3.org/2000/svg" width="760" height="574" viewBox="0 0 760 574" role="img" aria-labelledby="title desc">
<title id="title">Convert a memory-interface specification into a bound</title><desc id="desc">Check whether the published data rate already includes multiple transfers per clock. Do not count that factor twice.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993" /></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="572" rx="16" fill="#0b2e63" stroke="#375d8e" stroke-width="1.5" /><text x="32" y="36" font-size="13" fill="#8ed5c4" font-weight="700" text-anchor="start">CONCEPT D.1  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">Convert a memory-interface specification into</text><text x="32" y="112" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">a bound</text><rect x="32" y="160" width="696" height="60" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="54" y="196" font-size="15" fill="#f3b486" font-weight="700" text-anchor="start">01</text><text x="110" y="197" font-size="21" fill="#f5f4fa" font-weight="400" text-anchor="start">effective transfers per second</text><rect x="32" y="236" width="696" height="60" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="54" y="272" font-size="15" fill="#f3b486" font-weight="700" text-anchor="start">02</text><text x="110" y="273" font-size="21" fill="#f5f4fa" font-weight="400" text-anchor="start">* bytes transferred per channel</text><rect x="32" y="312" width="696" height="60" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="54" y="348" font-size="15" fill="#f3b486" font-weight="700" text-anchor="start">03</text><text x="110" y="349" font-size="21" fill="#f5f4fa" font-weight="400" text-anchor="start">* active memory channels</text><rect x="32" y="388" width="696" height="60" rx="12" fill="#123e68" stroke="#5b83b5" stroke-width="1.5" /><text x="54" y="424" font-size="15" fill="#f3b486" font-weight="700" text-anchor="start">04</text><text x="110" y="425" font-size="21" fill="#f5f4fa" font-weight="400" text-anchor="start">= theoretical bytes per second</text><rect x="32" y="472" width="696" height="82" rx="12" fill="#123e68" stroke="#467fac" stroke-width="1.5" /><text x="48" y="501" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">Check whether the published data rate already includes multiple transfers</text><text x="48" y="525" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">per clock. Do not count that factor twice.</text></g></svg>