<svg xmlns="http://www.w3.org/2000/svg" width="760" height="616" viewBox="0 0 760 616" role="img" aria-labelledby="title desc">
<title id="title">Route documents before applying their schema</title><desc id="desc">Document routing can be wrong; uncertain types should not be forced into a confident schema.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="614" rx="16" fill="#fbfaf7" stroke="#d8dedb" stroke-width="1.5"/><text x="32" y="36" font-size="13" fill="#a33516" font-weight="700" text-anchor="start">CONCEPT 21.2  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#182d38" font-weight="600" text-anchor="start">Route documents before applying their schema</text><rect x="32" y="138" width="286" height="74" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><rect x="408" y="138" width="320" height="74" rx="12" fill="#ffe4d6" stroke="#cbd5d8" stroke-width="1.5"/><text x="48" y="169" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">Invoice</text><text x="424" y="169" font-size="18" fill="#a33516" font-weight="400" text-anchor="start">invoice fields</text><path d="M322 175 L402 175" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="230" width="286" height="74" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><rect x="408" y="230" width="320" height="74" rx="12" fill="#ffe4d6" stroke="#cbd5d8" stroke-width="1.5"/><text x="48" y="261" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">Claim form</text><text x="424" y="261" font-size="18" fill="#a33516" font-weight="400" text-anchor="start">claim fields</text><path d="M322 267 L402 267" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="322" width="286" height="74" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><rect x="408" y="322" width="320" height="74" rx="12" fill="#ffe4d6" stroke="#cbd5d8" stroke-width="1.5"/><text x="48" y="353" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">Handwritten note</text><text x="424" y="353" font-size="18" fill="#a33516" font-weight="400" text-anchor="start">review-aware extraction</text><path d="M322 359 L402 359" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="414" width="286" height="74" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><rect x="408" y="414" width="320" height="74" rx="12" fill="#ffe4d6" stroke="#cbd5d8" stroke-width="1.5"/><text x="48" y="445" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">Unknown type</text><text x="424" y="445" font-size="18" fill="#a33516" font-weight="400" text-anchor="start">fallback or manual review</text><path d="M322 451 L402 451" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="514" width="696" height="82" rx="12" fill="#fff0e8" stroke="#e9b9a5" stroke-width="1.5"/><text x="48" y="543" font-size="16" fill="#a33516" font-weight="400" text-anchor="start">Document routing can be wrong; uncertain types should not be forced into a</text><text x="48" y="567" font-size="16" fill="#a33516" font-weight="400" text-anchor="start">confident schema.</text></g></svg>