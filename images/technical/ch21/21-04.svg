<svg xmlns="http://www.w3.org/2000/svg" width="760" height="482" viewBox="0 0 760 482" role="img" aria-labelledby="title desc">
<title id="title">Identification should retain uncertainty and context</title><desc id="desc">A camera image is not proof of species identity or population change without validation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="480" rx="16" fill="#fbfaf7" stroke="#d8dedb" stroke-width="1.5"/><text x="32" y="36" font-size="13" fill="#a33516" font-weight="700" text-anchor="start">CONCEPT 21.4  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#182d38" font-weight="600" text-anchor="start">Identification should retain uncertainty and</text><text x="32" y="112" font-size="27" fill="#182d38" font-weight="600" text-anchor="start">context</text><rect x="32" y="160" width="320" height="196" rx="12" fill="#ffe4d6" stroke="#cbd5d8" stroke-width="1.5"/><text x="50" y="194" font-size="20" fill="#a33516" font-weight="600" text-anchor="start">Visual evidence</text><text x="50" y="250" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">species candidates</text><text x="50" y="290" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">capture timestamp</text><text x="50" y="330" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">image quality limits</text><rect x="408" y="160" width="320" height="196" rx="12" fill="#faeee6" stroke="#cbd5d8" stroke-width="1.5"/><text x="426" y="194" font-size="20" fill="#9c3619" font-weight="600" text-anchor="start">Validated record</text><text x="426" y="250" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">human or expert review</text><text x="426" y="290" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">location/context checks</text><text x="426" y="330" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">auditable confidence limits</text><rect x="32" y="380" width="696" height="82" rx="12" fill="#fff0e8" stroke="#e9b9a5" stroke-width="1.5"/><text x="48" y="409" font-size="16" fill="#a33516" font-weight="400" text-anchor="start">A camera image is not proof of species identity or population change</text><text x="48" y="433" font-size="16" fill="#a33516" font-weight="400" text-anchor="start">without validation.</text></g></svg>