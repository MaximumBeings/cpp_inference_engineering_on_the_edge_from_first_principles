<svg xmlns="http://www.w3.org/2000/svg" width="760" height="574" viewBox="0 0 760 574" role="img" aria-labelledby="title desc">
<title id="title">Online softmax rescales old and new contributions</title><desc id="desc">Tile sums and weighted values use the same new maximum. Normalize o by l after the final tile.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993" /></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="572" rx="16" fill="#0b2e63" stroke="#375d8e" stroke-width="1.5" /><text x="32" y="36" font-size="13" fill="#8ed5c4" font-weight="700" text-anchor="start">CONCEPT 32.1  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">Online softmax rescales old and new</text><text x="32" y="112" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">contributions</text><rect x="32" y="160" width="696" height="60" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="54" y="196" font-size="15" fill="#f3b486" font-weight="700" text-anchor="start">01</text><text x="110" y="197" font-size="21" fill="#f5f4fa" font-weight="400" text-anchor="start">m_new = max(m_old,m_tile)</text><rect x="32" y="236" width="696" height="60" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="54" y="272" font-size="15" fill="#f3b486" font-weight="700" text-anchor="start">02</text><text x="110" y="273" font-size="21" fill="#f5f4fa" font-weight="400" text-anchor="start">alpha = exp(m_old-m_new)</text><rect x="32" y="312" width="696" height="60" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="54" y="348" font-size="15" fill="#f3b486" font-weight="700" text-anchor="start">03</text><text x="110" y="349" font-size="21" fill="#f5f4fa" font-weight="400" text-anchor="start">l_new = alpha*l_old + l_tile</text><rect x="32" y="388" width="696" height="60" rx="12" fill="#123e68" stroke="#5b83b5" stroke-width="1.5" /><text x="54" y="424" font-size="15" fill="#f3b486" font-weight="700" text-anchor="start">04</text><text x="110" y="425" font-size="21" fill="#f5f4fa" font-weight="400" text-anchor="start">o_new = alpha*o_old + o_tile</text><rect x="32" y="472" width="696" height="82" rx="12" fill="#123e68" stroke="#467fac" stroke-width="1.5" /><text x="48" y="501" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">Tile sums and weighted values use the same new maximum. Normalize o by l</text><text x="48" y="525" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">after the final tile.</text></g></svg>