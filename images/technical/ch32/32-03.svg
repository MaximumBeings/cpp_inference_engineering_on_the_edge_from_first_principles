<svg xmlns="http://www.w3.org/2000/svg" width="760" height="528" viewBox="0 0 760 528" role="img" aria-labelledby="title desc">
<title id="title">Validate kernels on real device work</title><desc id="desc">A skipped device run is not a pass. Partial tiles and block tails need explicit coverage.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993" /></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="526" rx="16" fill="#181e30" stroke="#3a455c" stroke-width="1.5" /><text x="32" y="36" font-size="13" fill="#8ed5c4" font-weight="700" text-anchor="start">CONCEPT 32.3  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">Validate kernels on real device work</text><rect x="32" y="138" width="320" height="116" rx="12" fill="#26324a" stroke="#5c6c88" stroke-width="1.5" /><text x="50" y="168" font-size="14" fill="#f3b486" font-weight="700" text-anchor="start">01</text><text x="50" y="200" font-size="20" fill="#f5f4fa" font-weight="500" text-anchor="start">Check device and CUDA</text><text x="50" y="227" font-size="20" fill="#f5f4fa" font-weight="500" text-anchor="start">calls</text><rect x="408" y="138" width="320" height="116" rx="12" fill="#26324a" stroke="#5c6c88" stroke-width="1.5" /><text x="426" y="168" font-size="14" fill="#f3b486" font-weight="700" text-anchor="start">02</text><text x="426" y="200" font-size="20" fill="#f5f4fa" font-weight="500" text-anchor="start">Run varied shapes and</text><text x="426" y="227" font-size="20" fill="#f5f4fa" font-weight="500" text-anchor="start">tails</text><rect x="408" y="286" width="320" height="116" rx="12" fill="#26324a" stroke="#5c6c88" stroke-width="1.5" /><text x="426" y="316" font-size="14" fill="#f3b486" font-weight="700" text-anchor="start">03</text><text x="426" y="348" font-size="20" fill="#f5f4fa" font-weight="500" text-anchor="start">Compare finite outputs to</text><text x="426" y="375" font-size="20" fill="#f5f4fa" font-weight="500" text-anchor="start">CPU</text><rect x="32" y="286" width="320" height="116" rx="12" fill="#26324a" stroke="#5c6c88" stroke-width="1.5" /><text x="50" y="316" font-size="14" fill="#f3b486" font-weight="700" text-anchor="start">04</text><text x="50" y="348" font-size="20" fill="#f5f4fa" font-weight="500" text-anchor="start">Run memory/race/sync</text><text x="50" y="375" font-size="20" fill="#f5f4fa" font-weight="500" text-anchor="start">checks</text><path d="M356 194 L402 194" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><path d="M568 258 L568 280" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><path d="M404 342 L358 342" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><rect x="32" y="426" width="696" height="82" rx="12" fill="#253d40" stroke="#426b66" stroke-width="1.5" /><text x="48" y="455" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">A skipped device run is not a pass. Partial tiles and block tails need</text><text x="48" y="479" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">explicit coverage.</text></g></svg>