<svg xmlns="http://www.w3.org/2000/svg" width="760" height="508" viewBox="0 0 760 508" role="img" aria-labelledby="title desc">
<title id="title">Choose parallel work from the dependency structure</title><desc id="desc">Measure overhead and bandwidth limits before adding workers. More threads do not remove a serial dependency.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993" /></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="506" rx="16" fill="#0b2e63" stroke="#375d8e" stroke-width="1.5" /><text x="32" y="36" font-size="13" fill="#8ed5c4" font-weight="700" text-anchor="start">CONCEPT C.2  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">Choose parallel work from the dependency</text><text x="32" y="112" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">structure</text><rect x="32" y="160" width="320" height="222" rx="12" fill="#123e68" stroke="#5b83b5" stroke-width="1.5" /><text x="50" y="194" font-size="20" fill="#8ed5c4" font-weight="600" text-anchor="start">Independent outputs</text><text x="50" y="250" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">partition rows or heads</text><text x="50" y="290" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">write disjoint output ranges</text><text x="50" y="330" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">synchronize dependent phases</text><rect x="408" y="160" width="320" height="222" rx="12" fill="#214b7b" stroke="#5b83b5" stroke-width="1.5" /><text x="426" y="194" font-size="20" fill="#f3b486" font-weight="600" text-anchor="start">Shared reductions</text><text x="426" y="250" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">define partial ownership</text><text x="426" y="290" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">reduce in a known order</text><text x="426" y="330" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">check determinism</text><text x="426" y="356" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">requirements</text><rect x="32" y="406" width="696" height="82" rx="12" fill="#123e68" stroke="#467fac" stroke-width="1.5" /><text x="48" y="435" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">Measure overhead and bandwidth limits before adding workers. More threads</text><text x="48" y="459" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">do not remove a serial dependency.</text></g></svg>