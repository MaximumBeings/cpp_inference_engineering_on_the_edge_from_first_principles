rker-end="url(#arrow)" /><rect x="32" y="414" width="286" height="74" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><rect x="408" y="414" width="320" height="74" rx="12" fill="#123e68" stroke="#5b83b5" stroke-width="1.5" /><text x="48" y="445" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">Match policy</text><text x="424" y="445" font-size="18" fill="#8ed5c4" font-weight="400" text-anchor="start">accept, review or unmatched</text><path d="M322 451 L402 451" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><rect x="32" y="514" width="696" height="82" rx="12" fill="#123e68" stroke="#467fac" stroke-width="1.5" /><text x="48" y="543" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">An ambiguous match should remain ambiguous rather than selecting an</text><text x="48" y="567" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">arbitrary transaction.</text></g></svg>