<svg xmlns="http://www.w3.org/2000/svg" width="760" height="572" viewBox="0 0 760 572" role="img" aria-labelledby="title desc">
<title id="title">A model file separates descriptors from payloads</title><desc id="desc">Offsets, dimensions and encoded byte counts must be checked against the actual file length.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993" /></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="570" rx="16" fill="#181e30" stroke="#3a455c" stroke-width="1.5" /><text x="32" y="36" font-size="13" fill="#8ed5c4" font-weight="700" text-anchor="start">CONCEPT 5.1  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">A model file separates descriptors from</text><text x="32" y="112" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">payloads</text><rect x="32" y="160" width="320" height="96" rx="12" fill="#253d40" stroke="#5c6c88" stroke-width="1.5" /><text x="48" y="187" font-size="12" fill="#bdc9df" font-weight="600" text-anchor="start">BLOCK 1</text><text x="48" y="218" font-size="19" fill="#f5f4fa" font-weight="400" text-anchor="start">magic and version</text><rect x="408" y="160" width="320" height="96" rx="12" fill="#44332e" stroke="#5c6c88" stroke-width="1.5" /><text x="424" y="187" font-size="12" fill="#bdc9df" font-weight="600" text-anchor="start">BLOCK 2</text><text x="424" y="218" font-size="19" fill="#f5f4fa" font-weight="400" text-anchor="start">key/value metadata</text><rect x="32" y="284" width="320" height="96" rx="12" fill="#253d40" stroke="#5c6c88" stroke-width="1.5" /><text x="48" y="311" font-size="12" fill="#bdc9df" font-weight="600" text-anchor="start">BLOCK 3</text><text x="48" y="342" font-size="19" fill="#f5f4fa" font-weight="400" text-anchor="start">tensor descriptors</text><rect x="408" y="284" width="320" height="96" rx="12" fill="#44332e" stroke="#5c6c88" stroke-width="1.5" /><text x="424" y="311" font-size="12" fill="#bdc9df" font-weight="600" text-anchor="start">BLOCK 4</text><text x="424" y="342" font-size="19" fill="#f5f4fa" font-weight="400" text-anchor="start">aligned tensor bytes</text><text x="32" y="443" font-size="17" fill="#8ed5c4" font-weight="600" text-anchor="start">One representation; explicit boundaries and ownership</text><rect x="32" y="470" width="696" height="82" rx="12" fill="#253d40" stroke="#426b66" stroke-width="1.5" /><text x="48" y="499" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">Offsets, dimensions and encoded byte counts must be checked against the</text><text x="48" y="523" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">actual file length.</text></g></svg>