<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
<title id="title">File metadata is not the quantization kernel</title><desc id="desc">A reader must explicitly support each encoded type. Recognizing a container is not full format support.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="458" rx="16" fill="#fbfaf7" stroke="#d8dedb" stroke-width="1.5"/><text x="32" y="36" font-size="13" fill="#0e756d" font-weight="700" text-anchor="start">CONCEPT 5.5  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#182d38" font-weight="600" text-anchor="start">File metadata is not the quantization kernel</text><rect x="32" y="138" width="320" height="196" rx="12" fill="#e8f1ed" stroke="#cbd5d8" stroke-width="1.5"/><text x="50" y="172" font-size="20" fill="#0e756d" font-weight="600" text-anchor="start">GGUF</text><text x="50" y="228" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">typed tensor descriptors</text><text x="50" y="268" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">quantized formats</text><text x="50" y="308" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">model metadata conventions</text><rect x="408" y="138" width="320" height="196" rx="12" fill="#faeee6" stroke="#cbd5d8" stroke-width="1.5"/><text x="426" y="172" font-size="20" fill="#b94c27" font-weight="600" text-anchor="start">SafeTensors</text><text x="426" y="228" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">JSON tensor descriptors</text><text x="426" y="268" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">dtype and byte offsets</text><text x="426" y="308" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">safe bounded data access</text><rect x="32" y="358" width="696" height="82" rx="12" fill="#eaf2ef" stroke="#d2e1db" stroke-width="1.5"/><text x="48" y="387" font-size="16" fill="#0e756d" font-weight="400" text-anchor="start">A reader must explicitly support each encoded type. Recognizing a container</text><text x="48" y="411" font-size="16" fill="#0e756d" font-weight="400" text-anchor="start">is not full format support.</text></g></svg>