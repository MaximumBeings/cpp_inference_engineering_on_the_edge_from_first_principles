<svg xmlns="http://www.w3.org/2000/svg" width="760" height="642" viewBox="0 0 760 642" role="img" aria-labelledby="title desc">
<title id="title">A two-coordinate rotation preserves squared length</title><desc id="desc">This illustrative angle explains the geometry. RoPE uses position- and frequency-dependent angles.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="640" rx="16" fill="#fbfaf7" stroke="#d8dedb" stroke-width="1.5"/><text x="32" y="36" font-size="13" fill="#0e756d" font-weight="700" text-anchor="start">CONCEPT 30.3  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#182d38" font-weight="600" text-anchor="start">A two-coordinate rotation preserves squared</text><text x="32" y="112" font-size="27" fill="#182d38" font-weight="600" text-anchor="start">length</text><circle cx="260" cy="320" r="120" fill="none" stroke="#b7c6cc" stroke-width="2"/><path d="M110 320 H420 M260 466 V168" fill="none" stroke="#a3b2ba" stroke-width="1.5"/><path d="M260 320 L380 320" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><path d="M260 320 L260 200" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><path d="M324 320 A64 64 0 0 0 260 256" fill="none" stroke="#b94c27" stroke-width="3" marker-end="url(#arrow)"/><text x="394" y="327" font-size="19" fill="#0e756d" font-weight="600" text-anchor="start">[1,0]</text><text x="275" y="192" font-size="19" fill="#0e756d" font-weight="600" text-anchor="start">[0,1]</text><text x="482" y="250" font-size="21" fill="#b94c27" font-weight="600" text-anchor="start">Illustrative</text><text x="482" y="279" font-size="21" fill="#b94c27" font-weight="600" text-anchor="start">rotation through 90</text><text x="482" y="308" font-size="21" fill="#b94c27" font-weight="600" text-anchor="start">degrees</text><text x="482" y="370" font-size="18" fill="#0e756d" font-weight="500" text-anchor="start">The vector length</text><text x="482" y="396" font-size="18" fill="#0e756d" font-weight="500" text-anchor="start">remains one.</text><text x="32" y="510" font-size="17" fill="#0e756d" font-weight="400" text-anchor="start">RoPE uses a different angle for each position and coordinate pair.</text><rect x="32" y="540" width="696" height="82" rx="12" fill="#eaf2ef" stroke="#d2e1db" stroke-width="1.5"/><text x="48" y="569" font-size="16" fill="#0e756d" font-weight="400" text-anchor="start">This illustrative angle explains the geometry. RoPE uses position- and</text><text x="48" y="593" font-size="16" fill="#0e756d" font-weight="400" text-anchor="start">frequency-dependent angles.</text></g></svg>