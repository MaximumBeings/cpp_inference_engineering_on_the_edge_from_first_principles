<svg xmlns="http://www.w3.org/2000/svg" width="760" height="616" viewBox="0 0 760 616" role="img" aria-labelledby="title desc">
<title id="title">Classify the failure before changing the code</title><desc id="desc">Read the first relevant diagnostic and reproduce it with the documented command before applying a fix.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993" /></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="614" rx="16" fill="#181e30" stroke="#3a455c" stroke-width="1.5" /><text x="32" y="36" font-size="13" fill="#8ed5c4" font-weight="700" text-anchor="start">CONCEPT A.4  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">Classify the failure before changing the code</text><rect x="32" y="138" width="286" height="74" rx="12" fill="#26324a" stroke="#5c6c88" stroke-width="1.5" /><rect x="408" y="138" width="320" height="74" rx="12" fill="#253d40" stroke="#5c6c88" stroke-width="1.5" /><text x="48" y="169" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">Missing header</text><text x="424" y="169" font-size="18" fill="#8ed5c4" font-weight="400" text-anchor="start">include path or dependency</text><path d="M322 175 L402 175" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><rect x="32" y="230" width="286" height="74" rx="12" fill="#26324a" stroke="#5c6c88" stroke-width="1.5" /><rect x="408" y="230" width="320" height="74" rx="12" fill="#253d40" stroke="#5c6c88" stroke-width="1.5" /><text x="48" y="261" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">Compile error</text><text x="424" y="261" font-size="18" fill="#8ed5c4" font-weight="400" text-anchor="start">language feature or source</text><path d="M322 267 L402 267" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><rect x="32" y="322" width="286" height="74" rx="12" fill="#26324a" stroke="#5c6c88" stroke-width="1.5" /><rect x="408" y="322" width="320" height="74" rx="12" fill="#253d40" stroke="#5c6c88" stroke-width="1.5" /><text x="48" y="353" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">Link error</text><text x="424" y="353" font-size="18" fill="#8ed5c4" font-weight="400" text-anchor="start">library symbols and link</text><text x="424" y="378" font-size="18" fill="#8ed5c4" font-weight="400" text-anchor="start">flags</text><path d="M322 359 L402 359" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><rect x="32" y="414" width="286" height="74" rx="12" fill="#26324a" stroke="#5c6c88" stroke-width="1.5" /><rect x="408" y="414" width="320" height="74" rx="12" fill="#253d40" stroke="#5c6c88" stroke-width="1.5" /><text x="48" y="445" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">Runtime failure</text><text x="424" y="445" font-size="18" fill="#8ed5c4" font-weight="400" text-anchor="start">inputs, environment or logic</text><path d="M322 451 L402 451" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><rect x="32" y="514" width="696" height="82" rx="12" fill="#253d40" stroke="#426b66" stroke-width="1.5" /><text x="48" y="543" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">Read the first relevant diagnostic and reproduce it with the documented</text><text x="48" y="567" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">command before applying a fix.</text></g></svg>