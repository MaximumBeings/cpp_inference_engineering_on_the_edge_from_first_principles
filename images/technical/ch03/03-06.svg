<svg xmlns="http://www.w3.org/2000/svg" width="760" height="572" viewBox="0 0 760 572" role="img" aria-labelledby="title desc">
<title id="title">Map file bytes and expose bounded tensor ranges</title><desc id="desc">File offsets identify tensor payloads. Views must not outlive the file mapping.</desc>
