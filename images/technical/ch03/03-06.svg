123e68" stroke="#467fac" stroke-width="1.5" /><text x="48" y="499" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">File offsets identify tensor payloads. Views must not outlive the file</text><text x="48" y="523" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">mapping.</text></g></svg>