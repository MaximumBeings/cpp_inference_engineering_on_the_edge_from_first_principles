<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
<title id="title">RoPE rotates pairs of coordinates</title><desc id="desc">Each pair has its own frequency. Rotation preserves its norm before finite-precision rounding.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993" /></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="618" rx="16" fill="#181e30" stroke="#3a455c" stroke-width="1.5" /><text x="32" y="36" font-size="13" fill="#8ed5c4" font-weight="700" text-anchor="start">CONCEPT 3.3  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">RoPE rotates pairs of coordinates</text><circle cx="260" cy="298" r="120" fill="none" stroke="#b7c6cc" stroke-width="2" /><path d="M110 298 H420 M260 444 V146" fill="none" stroke="#a3b2ba" stroke-width="1.5" /><path d="M260 298 L380 298" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><path d="M260 298 L260 178" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><path d="M324 298 A64 64 0 0 0 260 234" fill="none" stroke="#b94c27" stroke-width="3" marker-end="url(#arrow)" /><text x="394" y="305" font-size="19" fill="#8ed5c4" font-weight="600" text-anchor="start">[1,0]</text><text x="275" y="170" font-size="19" fill="#8ed5c4" font-weight="600" text-anchor="start">[0,1]</text><text x="482" y="228" font-size="21" fill="#f3b486" font-weight="600" text-anchor="start">Illustrative</text><text x="482" y="257" font-size="21" fill="#f3b486" font-weight="600" text-anchor="start">rotation through 90</text><text x="482" y="286" font-size="21" fill="#f3b486" font-weight="600" text-anchor="start">degrees</text><text x="482" y="348" font-size="18" fill="#8ed5c4" font-weight="500" text-anchor="start">The vector length</text><text x="482" y="374" font-size="18" fill="#8ed5c4" font-weight="500" text-anchor="start">remains one.</text><text x="32" y="488" font-size="17" fill="#8ed5c4" font-weight="400" text-anchor="start">RoPE uses a different angle for each position and coordinate pair.</text><rect x="32" y="518" width="696" height="82" rx="12" fill="#253d40" stroke="#426b66" stroke-width="1.5" /><text x="48" y="547" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">Each pair has its own frequency. Rotation preserves its norm before finite-</text><text x="48" y="571" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">precision rounding.</text></g></svg>