<svg xmlns="http://www.w3.org/2000/svg" width="760" height="682" viewBox="0 0 760 682" role="img" aria-labelledby="title desc">
<title id="title">Two projections form a gated feed-forward path</title><desc id="desc">The gate and up projections both read x. The gate modulates the up branch element by element.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993" /></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="680" rx="16" fill="#181e30" stroke="#3a455c" stroke-width="1.5" /><text x="32" y="36" font-size="13" fill="#8ed5c4" font-weight="700" text-anchor="start">CONCEPT 3.2  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">Two projections form a gated feed-forward path</text><rect x="280" y="138" width="200" height="60" rx="12" fill="#253d40" stroke="#5c6c88" stroke-width="1.5" /><text x="380" y="176" font-size="22" fill="#8ed5c4" font-weight="600" text-anchor="middle">Input x</text><path d="M330 202 L192 246" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><path d="M430 202 L568 246" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><rect x="32" y="250" width="320" height="74" rx="12" fill="#26324a" stroke="#5c6c88" stroke-width="1.5" /><text x="192" y="295" font-size="21" fill="#f5f4fa" font-weight="500" text-anchor="middle">SiLU(W_gate x)</text><rect x="408" y="250" width="320" height="74" rx="12" fill="#26324a" stroke="#5c6c88" stroke-width="1.5" /><text x="568" y="295" font-size="21" fill="#f5f4fa" font-weight="500" text-anchor="middle">W_up x</text><path d="M192 328 L330 374" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><path d="M568 328 L430 374" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><rect x="230" y="378" width="300" height="66" rx="12" fill="#44332e" stroke="#5c6c88" stroke-width="1.5" /><text x="380" y="419" font-size="21" fill="#f3b486" font-weight="600" text-anchor="middle">Elementwise multiply</text><path d="M380 448 L380 482" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><rect x="230" y="486" width="300" height="66" rx="12" fill="#26324a" stroke="#5c6c88" stroke-width="1.5" /><text x="380" y="527" font-size="21" fill="#f5f4fa" font-weight="500" text-anchor="middle">W_down projection</text><rect x="32" y="580" width="696" height="82" rx="12" fill="#253d40" stroke="#426b66" stroke-width="1.5" /><text x="48" y="609" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">The gate and up projections both read x. The gate modulates the up branch</text><text x="48" y="633" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">element by element.</text></g></svg>