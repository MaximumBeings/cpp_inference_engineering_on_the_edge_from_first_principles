<svg xmlns="http://www.w3.org/2000/svg" width="760" height="550" viewBox="0 0 760 550" role="img" aria-labelledby="title desc">
<title id="title">Inventory suggestions pass through an API boundary</title><desc id="desc">Use stable identifiers and retry-safe operations; do not assume every retry should add stock again.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="548" rx="16" fill="#fbfaf7" stroke="#d8dedb" stroke-width="1.5"/><text x="32" y="36" font-size="13" fill="#a33516" font-weight="700" text-anchor="start">CONCEPT 19.3  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#182d38" font-weight="600" text-anchor="start">Inventory suggestions pass through an API</text><text x="32" y="112" font-size="27" fill="#182d38" font-weight="600" text-anchor="start">boundary</text><rect x="32" y="160" width="320" height="116" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="50" y="190" font-size="14" fill="#9c3619" font-weight="700" text-anchor="start">01</text><text x="50" y="222" font-size="20" fill="#182d38" font-weight="500" text-anchor="start">Validated count estimate</text><rect x="408" y="160" width="320" height="116" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="426" y="190" font-size="14" fill="#9c3619" font-weight="700" text-anchor="start">02</text><text x="426" y="222" font-size="20" fill="#182d38" font-weight="500" text-anchor="start">Inventory update request</text><rect x="408" y="308" width="320" height="116" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="426" y="338" font-size="14" fill="#9c3619" font-weight="700" text-anchor="start">03</text><text x="426" y="370" font-size="20" fill="#182d38" font-weight="500" text-anchor="start">ERP/WMS validation</text><rect x="32" y="308" width="320" height="116" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="50" y="338" font-size="14" fill="#9c3619" font-weight="700" text-anchor="start">04</text><text x="50" y="370" font-size="20" fill="#182d38" font-weight="500" text-anchor="start">Recorded acknowledgement</text><path d="M356 216 L402 216" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><path d="M568 280 L568 302" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><path d="M404 364 L358 364" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="448" width="696" height="82" rx="12" fill="#fff0e8" stroke="#e9b9a5" stroke-width="1.5"/><text x="48" y="477" font-size="16" fill="#a33516" font-weight="400" text-anchor="start">Use stable identifiers and retry-safe operations; do not assume every retry</text><text x="48" y="501" font-size="16" fill="#a33516" font-weight="400" text-anchor="start">should add stock again.</text></g></svg>