ze="17" fill="#182d38" font-weight="400" text-anchor="start">amount</text><path d="M490 363 L510 363" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><rect x="516" y="327" width="212" height="72" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="528" y="356" font-size="17" fill="#182d38" font-weight="400" text-anchor="start">time</text><text x="32" y="436" font-size="18" fill="#a33516" font-weight="600" text-anchor="start">Window rule</text><rect x="32" y="454" width="212" height="72" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="44" y="483" font-size="17" fill="#182d38" font-weight="400" text-anchor="start">sum/count activity</text><path d="M248 490 L268 490" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><rect x="274" y="454" width="212" height="72" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="286" y="483" font-size="17" fill="#182d38" font-weight="400" text-anchor="start">apply rule</text><path d="M490 490 L510 490" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><rect x="516" y="454" width="212" height="72" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="528" y="483" font-size="17" fill="#182d38" font-weight="400" text-anchor="start">review candidate</text><rect x="32" y="545" width="696" height="82" rx="12" fill="#fff0e8" stroke="#e9b9a5" stroke-width="1.5"/><text x="48" y="574" font-size="16" fill="#a33516" font-weight="400" text-anchor="start">Structuring rules depend on jurisdiction and context. A pattern flag is not</text><text x="48" y="598" font-size="16" fill="#a33516" font-weight="400" text-anchor="start">proof of criminal conduct.</text></g></svg>