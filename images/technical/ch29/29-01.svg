<svg xmlns="http://www.w3.org/2000/svg" width="760" height="647" viewBox="0 0 760 647" role="img" aria-labelledby="title desc">
<title id="title">Windowed aggregation detects a pattern candidate</title><desc id="desc">Structuring rules depend on jurisdiction and context. A pattern flag is not proof of criminal conduct.</desc>
