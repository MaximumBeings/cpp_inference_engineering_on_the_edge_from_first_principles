<svg xmlns="http://www.w3.org/2000/svg" width="760" height="552" viewBox="0 0 760 552" role="img" aria-labelledby="title desc">
<title id="title">Separate integer accumulation from scaling</title><desc id="desc">This simplified symmetric case has zero point zero. Nonzero zero points require correction terms.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993" /></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="550" rx="16" fill="#181e30" stroke="#3a455c" stroke-width="1.5" /><text x="32" y="36" font-size="13" fill="#8ed5c4" font-weight="700" text-anchor="start">CONCEPT 4.5  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">Separate integer accumulation from scaling</text><rect x="32" y="138" width="696" height="60" rx="12" fill="#26324a" stroke="#5c6c88" stroke-width="1.5" /><text x="54" y="174" font-size="15" fill="#f3b486" font-weight="700" text-anchor="start">01</text><text x="110" y="175" font-size="21" fill="#f5f4fa" font-weight="400" text-anchor="start">weights -&gt; q_w, s_w</text><rect x="32" y="214" width="696" height="60" rx="12" fill="#26324a" stroke="#5c6c88" stroke-width="1.5" /><text x="54" y="250" font-size="15" fill="#f3b486" font-weight="700" text-anchor="start">02</text><text x="110" y="251" font-size="21" fill="#f5f4fa" font-weight="400" text-anchor="start">activations -&gt; q_x, s_x</text><rect x="32" y="290" width="696" height="60" rx="12" fill="#26324a" stroke="#5c6c88" stroke-width="1.5" /><text x="54" y="326" font-size="15" fill="#f3b486" font-weight="700" text-anchor="start">03</text><text x="110" y="327" font-size="21" fill="#f5f4fa" font-weight="400" text-anchor="start">dot_int = sum(q_w*q_x)</text><rect x="32" y="366" width="696" height="60" rx="12" fill="#253d40" stroke="#5c6c88" stroke-width="1.5" /><text x="54" y="402" font-size="15" fill="#f3b486" font-weight="700" text-anchor="start">04</text><text x="110" y="403" font-size="21" fill="#f5f4fa" font-weight="400" text-anchor="start">dot_float ~ s_w*s_x*dot_int</text><rect x="32" y="450" width="696" height="82" rx="12" fill="#253d40" stroke="#426b66" stroke-width="1.5" /><text x="48" y="479" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">This simplified symmetric case has zero point zero. Nonzero zero points</text><text x="48" y="503" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">require correction terms.</text></g></svg>