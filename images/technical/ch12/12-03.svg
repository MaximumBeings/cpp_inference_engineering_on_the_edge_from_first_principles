<svg xmlns="http://www.w3.org/2000/svg" width="760" height="550" viewBox="0 0 760 550" role="img" aria-labelledby="title desc">
<title id="title">A chat template is part of the input format</title><desc id="desc">Use the model vocabulary IDs and exact template. Similar-looking text is not the same token sequence.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993" /></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="548" rx="16" fill="#0b2e63" stroke="#375d8e" stroke-width="1.5" /><text x="32" y="36" font-size="13" fill="#8ed5c4" font-weight="700" text-anchor="start">CONCEPT 12.3  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">A chat template is part of the input format</text><rect x="32" y="138" width="320" height="96" rx="12" fill="#123e68" stroke="#5b83b5" stroke-width="1.5" /><text x="48" y="165" font-size="12" fill="#bdc9df" font-weight="600" text-anchor="start">BLOCK 1</text><text x="48" y="196" font-size="19" fill="#f5f4fa" font-weight="400" text-anchor="start">start-of-message token</text><rect x="408" y="138" width="320" height="96" rx="12" fill="#214b7b" stroke="#5b83b5" stroke-width="1.5" /><text x="424" y="165" font-size="12" fill="#bdc9df" font-weight="600" text-anchor="start">BLOCK 2</text><text x="424" y="196" font-size="19" fill="#f5f4fa" font-weight="400" text-anchor="start">role and separator</text><rect x="32" y="262" width="320" height="96" rx="12" fill="#123e68" stroke="#5b83b5" stroke-width="1.5" /><text x="48" y="289" font-size="12" fill="#bdc9df" font-weight="600" text-anchor="start">BLOCK 3</text><text x="48" y="320" font-size="19" fill="#f5f4fa" font-weight="400" text-anchor="start">message content</text><rect x="408" y="262" width="320" height="96" rx="12" fill="#214b7b" stroke="#5b83b5" stroke-width="1.5" /><text x="424" y="289" font-size="12" fill="#bdc9df" font-weight="600" text-anchor="start">BLOCK 4</text><text x="424" y="320" font-size="19" fill="#f5f4fa" font-weight="400" text-anchor="start">end-of-message token</text><text x="32" y="421" font-size="17" fill="#8ed5c4" font-weight="600" text-anchor="start">One representation; explicit boundaries and ownership</text><rect x="32" y="448" width="696" height="82" rx="12" fill="#123e68" stroke="#467fac" stroke-width="1.5" /><text x="48" y="477" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">Use the model vocabulary IDs and exact template. Similar-looking text is</text><text x="48" y="501" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">not the same token sequence.</text></g></svg>