<svg xmlns="http://www.w3.org/2000/svg" width="760" height="504" viewBox="0 0 760 504" role="img" aria-labelledby="title desc">
<title id="title">Streaming bytes must end at UTF-8 boundaries</title><desc id="desc">A token boundary is not necessarily a Unicode character boundary.</desc>
