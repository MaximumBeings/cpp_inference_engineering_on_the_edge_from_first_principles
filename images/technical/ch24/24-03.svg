<svg xmlns="http://www.w3.org/2000/svg" width="760" height="616" viewBox="0 0 760 616" role="img" aria-labelledby="title desc">
<title id="title">An operation table is an allowlist</title><desc id="desc">The table makes supported behavior explicit rather than executing arbitrary model-generated code.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="614" rx="16" fill="#fbfaf7" stroke="#d8dedb" stroke-width="1.5"/><text x="32" y="36" font-size="13" fill="#0e756d" font-weight="700" text-anchor="start">CONCEPT 24.3  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#182d38" font-weight="600" text-anchor="start">An operation table is an allowlist</text><rect x="32" y="138" width="286" height="74" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><rect x="408" y="138" width="320" height="74" rx="12" fill="#e8f1ed" stroke="#cbd5d8" stroke-width="1.5"/><text x="48" y="169" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">brightness</text><text x="424" y="169" font-size="18" fill="#0e756d" font-weight="400" text-anchor="start">bounded intensity adjustment</text><path d="M322 175 L402 175" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="230" width="286" height="74" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><rect x="408" y="230" width="320" height="74" rx="12" fill="#e8f1ed" stroke="#cbd5d8" stroke-width="1.5"/><text x="48" y="261" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">crop</text><text x="424" y="261" font-size="18" fill="#0e756d" font-weight="400" text-anchor="start">validated rectangle</text><path d="M322 267 L402 267" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="322" width="286" height="74" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><rect x="408" y="322" width="320" height="74" rx="12" fill="#e8f1ed" stroke="#cbd5d8" stroke-width="1.5"/><text x="48" y="353" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">blur</text><text x="424" y="353" font-size="18" fill="#0e756d" font-weight="400" text-anchor="start">supported kernel parameters</text><path d="M322 359 L402 359" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="414" width="286" height="74" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><rect x="408" y="414" width="320" height="74" rx="12" fill="#e8f1ed" stroke="#cbd5d8" stroke-width="1.5"/><text x="48" y="445" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">unknown request</text><text x="424" y="445" font-size="18" fill="#0e756d" font-weight="400" text-anchor="start">reject or ask for</text><text x="424" y="470" font-size="18" fill="#0e756d" font-weight="400" text-anchor="start">clarification</text><path d="M322 451 L402 451" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="514" width="696" height="82" rx="12" fill="#eaf2ef" stroke="#d2e1db" stroke-width="1.5"/><text x="48" y="543" font-size="16" fill="#0e756d" font-weight="400" text-anchor="start">The table makes supported behavior explicit rather than executing arbitrary</text><text x="48" y="567" font-size="16" fill="#0e756d" font-weight="400" text-anchor="start">model-generated code.</text></g></svg>