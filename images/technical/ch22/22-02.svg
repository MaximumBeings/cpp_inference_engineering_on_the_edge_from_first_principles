<svg xmlns="http://www.w3.org/2000/svg" width="760" height="482" viewBox="0 0 760 482" role="img" aria-labelledby="title desc">
<title id="title">A photographed feature is not a full compliance audit</title><desc id="desc">Perspective, hidden features and missing dimensions limit conclusions from a photo.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="480" rx="16" fill="#fbfaf7" stroke="#d8dedb" stroke-width="1.5"/><text x="32" y="36" font-size="13" fill="#0e756d" font-weight="700" text-anchor="start">CONCEPT 22.2  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#182d38" font-weight="600" text-anchor="start">A photographed feature is not a full</text><text x="32" y="112" font-size="27" fill="#182d38" font-weight="600" text-anchor="start">compliance audit</text><rect x="32" y="160" width="320" height="196" rx="12" fill="#e8f1ed" stroke="#cbd5d8" stroke-width="1.5"/><text x="50" y="194" font-size="20" fill="#0e756d" font-weight="600" text-anchor="start">Image observations</text><text x="50" y="250" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">visible doorway</text><text x="50" y="290" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">visible obstruction</text><text x="50" y="330" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">estimated geometric feature</text><rect x="408" y="160" width="320" height="196" rx="12" fill="#faeee6" stroke="#cbd5d8" stroke-width="1.5"/><text x="426" y="194" font-size="20" fill="#b94c27" font-weight="600" text-anchor="start">Compliance decision</text><text x="426" y="250" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">reliable measurements</text><text x="426" y="290" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">applicable requirements</text><text x="426" y="330" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">qualified review</text><rect x="32" y="380" width="696" height="82" rx="12" fill="#eaf2ef" stroke="#d2e1db" stroke-width="1.5"/><text x="48" y="409" font-size="16" fill="#0e756d" font-weight="400" text-anchor="start">Perspective, hidden features and missing dimensions limit conclusions from</text><text x="48" y="433" font-size="16" fill="#0e756d" font-weight="400" text-anchor="start">a photo.</text></g></svg>