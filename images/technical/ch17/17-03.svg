<svg xmlns="http://www.w3.org/2000/svg" width="760" height="486" viewBox="0 0 760 486" role="img" aria-labelledby="title desc">
<title id="title">A comparison needs the same work on both sides</title><desc id="desc">A schematic or analytical estimate must not be presented as a measured runtime comparison.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993" /></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="484" rx="16" fill="#181e30" stroke="#3a455c" stroke-width="1.5" /><text x="32" y="36" font-size="13" fill="#8ed5c4" font-weight="700" text-anchor="start">CONCEPT 17.3  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">A comparison needs the same work on both sides</text><rect x="32" y="138" width="320" height="222" rx="12" fill="#253d40" stroke="#5c6c88" stroke-width="1.5" /><text x="50" y="172" font-size="20" fill="#8ed5c4" font-weight="600" text-anchor="start">Engine under test</text><text x="50" y="228" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">same model and precision</text><text x="50" y="268" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">same prompts and token</text><text x="50" y="294" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">budget</text><text x="50" y="334" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">declared runtime settings</text><rect x="408" y="138" width="320" height="222" rx="12" fill="#44332e" stroke="#5c6c88" stroke-width="1.5" /><text x="426" y="172" font-size="20" fill="#f3b486" font-weight="600" text-anchor="start">Reference runtime</text><text x="426" y="228" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">same model and precision</text><text x="426" y="268" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">same prompts and token</text><text x="426" y="294" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">budget</text><text x="426" y="334" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">declared runtime settings</text><rect x="32" y="384" width="696" height="82" rx="12" fill="#253d40" stroke="#426b66" stroke-width="1.5" /><text x="48" y="413" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">A schematic or analytical estimate must not be presented as a measured</text><text x="48" y="437" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">runtime comparison.</text></g></svg>