<svg xmlns="http://www.w3.org/2000/svg" width="760" height="516" viewBox="0 0 760 516" role="img" aria-labelledby="title desc">
<title id="title">A two-dimensional view over one allocation</title><desc id="desc">The view stores shape and strides; the arena owns the twelve elements.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="514" rx="16" fill="#fbfaf7" stroke="#d8dedb" stroke-width="1.5"/><text x="32" y="36" font-size="13" fill="#a33516" font-weight="700" text-anchor="start">CONCEPT 2.1  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#182d38" font-weight="600" text-anchor="start">A two-dimensional view over one allocation</text><rect x="32" y="138" width="70" height="62" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="67" y="176" font-size="21" fill="#182d38" font-weight="600" text-anchor="middle">0</text><rect x="114" y="138" width="70" height="62" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="149" y="176" font-size="21" fill="#182d38" font-weight="600" text-anchor="middle">1</text><rect x="196" y="138" width="70" height="62" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="231" y="176" font-size="21" fill="#182d38" font-weight="600" text-anchor="middle">2</text><rect x="278" y="138" width="70" height="62" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="313" y="176" font-size="21" fill="#182d38" font-weight="600" text-anchor="middle">3</text><rect x="32" y="212" width="70" height="62" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="67" y="250" font-size="21" fill="#182d38" font-weight="600" text-anchor="middle">4</text><rect x="114" y="212" width="70" height="62" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="149" y="250" font-size="21" fill="#182d38" font-weight="600" text-anchor="middle">5</text><rect x="196" y="212" width="70" height="62" rx="12" fill="#a33516" stroke="#cbd5d8" stroke-width="1.5"/><text x="231" y="250" font-size="21" fill="#fff" font-weight="600" text-anchor="middle">6</text><rect x="278" y="212" width="70" height="62" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="313" y="250" font-size="21" fill="#182d38" font-weight="600" text-anchor="middle">7</text><rect x="32" y="286" width="70" height="62" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="67" y="324" font-size="21" fill="#182d38" font-weight="600" text-anchor="middle">8</text><rect x="114" y="286" width="70" height="62" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="149" y="324" font-size="21" fill="#182d38" font-weight="600" text-anchor="middle">9</text><rect x="196" y="286" width="70" height="62" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="231" y="324" font-size="21" fill="#182d38" font-weight="600" text-anchor="middle">10</text><rect x="278" y="286" width="70" height="62" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="313" y="324" font-size="21" fill="#182d38" font-weight="600" text-anchor="middle">11</text><text x="414" y="173" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">3 rows x 4 columns</text><text x="414" y="226" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">row stride = 4 elements</text><text x="414" y="279" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">column stride = 1 element</text><text x="414" y="332" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">element (1,2) is offset 6</text><text x="32" y="407" font-size="17" fill="#a33516" font-weight="400" text-anchor="start">Flat addresses increase from left to right in each row.</text><rect x="32" y="438" width="696" height="58" rx="12" fill="#fff0e8" stroke="#e9b9a5" stroke-width="1.5"/><text x="48" y="467" font-size="16" fill="#a33516" font-weight="400" text-anchor="start">The view stores shape and strides; the arena owns the twelve elements.</text></g></svg>