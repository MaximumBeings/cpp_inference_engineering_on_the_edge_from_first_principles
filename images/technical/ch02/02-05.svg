<svg xmlns="http://www.w3.org/2000/svg" width="760" height="486" viewBox="0 0 760 486" role="img" aria-labelledby="title desc">
<title id="title">A format tag selects a typed representation</title><desc id="desc">std::variant makes the active storage alternative explicit. A tag does not convert the payload.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="484" rx="16" fill="#fbfaf7" stroke="#d8dedb" stroke-width="1.5"/><text x="32" y="36" font-size="13" fill="#a33516" font-weight="700" text-anchor="start">CONCEPT 2.5  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#182d38" font-weight="600" text-anchor="start">A format tag selects a typed representation</text><rect x="32" y="138" width="320" height="222" rx="12" fill="#ffe4d6" stroke="#cbd5d8" stroke-width="1.5"/><text x="50" y="172" font-size="20" fill="#a33516" font-weight="600" text-anchor="start">Floating storage</text><text x="50" y="228" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">FP32 or FP16 elements</text><text x="50" y="268" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">typed buffer and extent</text><text x="50" y="308" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">matching arithmetic kernel</text><rect x="408" y="138" width="320" height="222" rx="12" fill="#faeee6" stroke="#cbd5d8" stroke-width="1.5"/><text x="426" y="172" font-size="20" fill="#9c3619" font-weight="600" text-anchor="start">Quantized storage</text><text x="426" y="228" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">packed integers and scales</text><text x="426" y="268" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">block format metadata</text><text x="426" y="308" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">matching dequantization</text><text x="426" y="334" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">kernel</text><rect x="32" y="384" width="696" height="82" rx="12" fill="#fff0e8" stroke="#e9b9a5" stroke-width="1.5"/><text x="48" y="413" font-size="16" fill="#a33516" font-weight="400" text-anchor="start">std::variant makes the active storage alternative explicit. A tag does not</text><text x="48" y="437" font-size="16" fill="#a33516" font-weight="400" text-anchor="start">convert the payload.</text></g></svg>