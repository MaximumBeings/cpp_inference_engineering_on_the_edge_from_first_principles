<svg xmlns="http://www.w3.org/2000/svg" width="760" height="638" viewBox="0 0 760 638" role="img" aria-labelledby="title desc">
<title id="title">A serving stack has several distinct responsibilities</title><desc id="desc">The book engine exposes the core path. A production service adds transport, isolation, observability and operating controls.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993" /></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="636" rx="16" fill="#0b2e63" stroke="#375d8e" stroke-width="1.5" /><text x="32" y="36" font-size="13" fill="#8ed5c4" font-weight="700" text-anchor="start">CONCEPT E.4  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">A serving stack has several distinct</text><text x="32" y="112" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">responsibilities</text><rect x="32" y="160" width="286" height="74" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><rect x="408" y="160" width="320" height="74" rx="12" fill="#123e68" stroke="#5b83b5" stroke-width="1.5" /><text x="48" y="191" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">Model loading</text><text x="424" y="191" font-size="18" fill="#8ed5c4" font-weight="400" text-anchor="start">validated weights and</text><text x="424" y="216" font-size="18" fill="#8ed5c4" font-weight="400" text-anchor="start">metadata</text><path d="M322 197 L402 197" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><rect x="32" y="252" width="286" height="74" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><rect x="408" y="252" width="320" height="74" rx="12" fill="#123e68" stroke="#5b83b5" stroke-width="1.5" /><text x="48" y="283" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">Tokenization</text><text x="424" y="283" font-size="18" fill="#8ed5c4" font-weight="400" text-anchor="start">request-to-token conventions</text><path d="M322 289 L402 289" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><rect x="32" y="344" width="286" height="74" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><rect x="408" y="344" width="320" height="74" rx="12" fill="#123e68" stroke="#5b83b5" stroke-width="1.5" /><text x="48" y="375" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">Execution</text><text x="424" y="375" font-size="18" fill="#8ed5c4" font-weight="400" text-anchor="start">forward pass and KV state</text><path d="M322 381 L402 381" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><rect x="32" y="436" width="286" height="74" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><rect x="408" y="436" width="320" height="74" rx="12" fill="#123e68" stroke="#5b83b5" stroke-width="1.5" /><text x="48" y="467" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">Request service</text><text x="424" y="467" font-size="18" fill="#8ed5c4" font-weight="400" text-anchor="start">admission, streaming and</text><text x="424" y="492" font-size="18" fill="#8ed5c4" font-weight="400" text-anchor="start">errors</text><path d="M322 473 L402 473" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><rect x="32" y="536" width="696" height="82" rx="12" fill="#123e68" stroke="#467fac" stroke-width="1.5" /><text x="48" y="565" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">The book engine exposes the core path. A production service adds transport,</text><text x="48" y="589" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">isolation, observability and operating controls.</text></g></svg>