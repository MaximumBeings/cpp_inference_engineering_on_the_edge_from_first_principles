<svg xmlns="http://www.w3.org/2000/svg" width="760" height="486" viewBox="0 0 760 486" role="img" aria-labelledby="title desc">
<title id="title">A teaching cache manager has a smaller scope</title><desc id="desc">Compare mechanisms explicitly. Do not infer production feature parity from similar terminology.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993" /></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="484" rx="16" fill="#0b2e63" stroke="#375d8e" stroke-width="1.5" /><text x="32" y="36" font-size="13" fill="#8ed5c4" font-weight="700" text-anchor="start">CONCEPT E.3  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">A teaching cache manager has a smaller scope</text><rect x="32" y="138" width="320" height="222" rx="12" fill="#123e68" stroke="#5b83b5" stroke-width="1.5" /><text x="50" y="172" font-size="20" fill="#8ed5c4" font-weight="600" text-anchor="start">Book implementation</text><text x="50" y="228" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">explicit block ownership</text><text x="50" y="268" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">logical-to-physical lookup</text><text x="50" y="308" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">verified local behavior</text><rect x="408" y="138" width="320" height="222" rx="12" fill="#214b7b" stroke="#5b83b5" stroke-width="1.5" /><text x="426" y="172" font-size="20" fill="#f3b486" font-weight="600" text-anchor="start">Production serving</text><text x="426" y="199" font-size="20" fill="#f3b486" font-weight="600" text-anchor="start">systems</text><text x="426" y="228" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">broader allocation policies</text><text x="426" y="268" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">prefix reuse and scheduling</text><text x="426" y="308" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">deployment-specific</text><text x="426" y="334" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">integration</text><rect x="32" y="384" width="696" height="82" rx="12" fill="#123e68" stroke="#467fac" stroke-width="1.5" /><text x="48" y="413" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">Compare mechanisms explicitly. Do not infer production feature parity from</text><text x="48" y="437" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">similar terminology.</text></g></svg>