<svg xmlns="http://www.w3.org/2000/svg" width="760" height="486" viewBox="0 0 760 486" role="img" aria-labelledby="title desc">
<title id="title">A fixed reduction tree makes ordering explicit</title><desc id="desc">Floating-point addition is not associative. Determinism requires controlling operation order.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="484" rx="16" fill="#fbfaf7" stroke="#d8dedb" stroke-width="1.5"/><text x="32" y="36" font-size="13" fill="#0e756d" font-weight="700" text-anchor="start">CONCEPT 11.4  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#182d38" font-weight="600" text-anchor="start">A fixed reduction tree makes ordering explicit</text><rect x="32" y="138" width="320" height="222" rx="12" fill="#e8f1ed" stroke="#cbd5d8" stroke-width="1.5"/><text x="50" y="172" font-size="20" fill="#0e756d" font-weight="600" text-anchor="start">Worker-dependent sum</text><text x="50" y="228" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">partition changes with</text><text x="50" y="254" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">worker count</text><text x="50" y="294" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">addition order changes</text><text x="50" y="334" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">last bits may change</text><rect x="408" y="138" width="320" height="222" rx="12" fill="#faeee6" stroke="#cbd5d8" stroke-width="1.5"/><text x="426" y="172" font-size="20" fill="#b94c27" font-weight="600" text-anchor="start">Fixed logical chunks</text><text x="426" y="228" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">same chunk boundaries</text><text x="426" y="268" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">same reduction tree</text><text x="426" y="308" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">stable arithmetic ordering</text><rect x="32" y="384" width="696" height="82" rx="12" fill="#eaf2ef" stroke="#d2e1db" stroke-width="1.5"/><text x="48" y="413" font-size="16" fill="#0e756d" font-weight="400" text-anchor="start">Floating-point addition is not associative. Determinism requires</text><text x="48" y="437" font-size="16" fill="#0e756d" font-weight="400" text-anchor="start">controlling operation order.</text></g></svg>