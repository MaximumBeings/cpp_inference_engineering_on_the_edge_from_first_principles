<svg xmlns="http://www.w3.org/2000/svg" width="760" height="625" viewBox="0 0 760 625" role="img" aria-labelledby="title desc">
<title id="title">Keep worker threads across layer phases</title><desc id="desc">Persistent threads avoid repeated creation. They do not remove dependencies between phases.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="623" rx="16" fill="#fbfaf7" stroke="#d8dedb" stroke-width="1.5"/><text x="32" y="36" font-size="13" fill="#0e756d" font-weight="700" text-anchor="start">CONCEPT 11.2  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#182d38" font-weight="600" text-anchor="start">Keep worker threads across layer phases</text><text x="32" y="160" font-size="18" fill="#0e756d" font-weight="600" text-anchor="start">Attention</text><rect x="32" y="178" width="212" height="72" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="44" y="207" font-size="17" fill="#182d38" font-weight="400" text-anchor="start">QKV tasks</text><path d="M248 214 L268 214" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><rect x="274" y="178" width="212" height="72" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="286" y="207" font-size="17" fill="#182d38" font-weight="400" text-anchor="start">barrier</text><path d="M490 214 L510 214" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><rect x="516" y="178" width="212" height="72" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="528" y="207" font-size="17" fill="#182d38" font-weight="400" text-anchor="start">attention output</text><text x="32" y="287" font-size="18" fill="#0e756d" font-weight="600" text-anchor="start">Feed-forward</text><rect x="32" y="305" width="212" height="72" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="44" y="334" font-size="17" fill="#182d38" font-weight="400" text-anchor="start">gate/up tasks</text><path d="M248 341 L268 341" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><rect x="274" y="305" width="212" height="72" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="286" y="334" font-size="17" fill="#182d38" font-weight="400" text-anchor="start">barrier</text><path d="M490 341 L510 341" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><rect x="516" y="305" width="212" height="72" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="528" y="334" font-size="17" fill="#182d38" font-weight="400" text-anchor="start">down projection</text><text x="32" y="414" font-size="18" fill="#0e756d" font-weight="600" text-anchor="start">Residual</text><rect x="32" y="432" width="212" height="72" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="44" y="461" font-size="17" fill="#182d38" font-weight="400" text-anchor="start">read completed output</text><path d="M248 468 L268 468" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><rect x="274" y="432" width="212" height="72" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="286" y="461" font-size="17" fill="#182d38" font-weight="400" text-anchor="start">add input</text><path d="M490 468 L510 468" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><rect x="516" y="432" width="212" height="72" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="528" y="461" font-size="17" fill="#182d38" font-weight="400" text-anchor="start">next phase</text><rect x="32" y="523" width="696" height="82" rx="12" fill="#eaf2ef" stroke="#d2e1db" stroke-width="1.5"/><text x="48" y="552" font-size="16" fill="#0e756d" font-weight="400" text-anchor="start">Persistent threads avoid repeated creation. They do not remove dependencies</text><text x="48" y="576" font-size="16" fill="#0e756d" font-weight="400" text-anchor="start">between phases.</text></g></svg>