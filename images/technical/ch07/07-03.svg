<svg xmlns="http://www.w3.org/2000/svg" width="760" height="510" viewBox="0 0 760 510" role="img" aria-labelledby="title desc">
<title id="title">Reconstruction error and dot-product bias differ</title><desc id="desc">Low MSE alone is not a proof that an estimated attention score is unbiased.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="508" rx="16" fill="#fbfaf7" stroke="#d8dedb" stroke-width="1.5"/><text x="32" y="36" font-size="13" fill="#a33516" font-weight="700" text-anchor="start">CONCEPT 7.3  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#182d38" font-weight="600" text-anchor="start">Reconstruction error and dot-product bias</text><text x="32" y="112" font-size="27" fill="#182d38" font-weight="600" text-anchor="start">differ</text><rect x="32" y="160" width="320" height="248" rx="12" fill="#ffe4d6" stroke="#cbd5d8" stroke-width="1.5"/><text x="50" y="194" font-size="20" fill="#a33516" font-weight="600" text-anchor="start">MSE objective</text><text x="50" y="250" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">reduce squared</text><text x="50" y="276" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">reconstruction error</text><text x="50" y="316" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">good average vector recovery</text><text x="50" y="356" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">does not guarantee unbiased</text><text x="50" y="382" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">dots</text><rect x="408" y="160" width="320" height="248" rx="12" fill="#faeee6" stroke="#cbd5d8" stroke-width="1.5"/><text x="426" y="194" font-size="20" fill="#9c3619" font-weight="600" text-anchor="start">Inner-product correction</text><text x="426" y="250" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">represent residual</text><text x="426" y="276" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">information</text><text x="426" y="316" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">correct the dot estimate</text><text x="426" y="356" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">requires its own metadata</text><rect x="32" y="432" width="696" height="58" rx="12" fill="#fff0e8" stroke="#e9b9a5" stroke-width="1.5"/><text x="48" y="461" font-size="16" fill="#a33516" font-weight="400" text-anchor="start">Low MSE alone is not a proof that an estimated attention score is unbiased.</text></g></svg>