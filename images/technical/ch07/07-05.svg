<svg xmlns="http://www.w3.org/2000/svg" width="760" height="508" viewBox="0 0 760 508" role="img" aria-labelledby="title desc">
<title id="title">Two compression families use different metadata</title><desc id="desc">Compare total bytes and task error under the same workload. No measured speedup is implied.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="506" rx="16" fill="#fbfaf7" stroke="#d8dedb" stroke-width="1.5"/><text x="32" y="36" font-size="13" fill="#0e756d" font-weight="700" text-anchor="start">CONCEPT 7.5  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#182d38" font-weight="600" text-anchor="start">Two compression families use different</text><text x="32" y="112" font-size="27" fill="#182d38" font-weight="600" text-anchor="start">metadata</text><rect x="32" y="160" width="320" height="222" rx="12" fill="#e8f1ed" stroke="#cbd5d8" stroke-width="1.5"/><text x="50" y="194" font-size="20" fill="#0e756d" font-weight="600" text-anchor="start">Blockwise quantization</text><text x="50" y="250" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">local scale per block</text><text x="50" y="290" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">integer codes</text><text x="50" y="330" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">format-specific packing</text><rect x="408" y="160" width="320" height="222" rx="12" fill="#faeee6" stroke="#cbd5d8" stroke-width="1.5"/><text x="426" y="194" font-size="20" fill="#b94c27" font-weight="600" text-anchor="start">Rotation + codebook</text><text x="426" y="250" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">shared transform convention</text><text x="426" y="290" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">codebook indices</text><text x="426" y="330" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">residual correction as</text><text x="426" y="356" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">required</text><rect x="32" y="406" width="696" height="82" rx="12" fill="#eaf2ef" stroke="#d2e1db" stroke-width="1.5"/><text x="48" y="435" font-size="16" fill="#0e756d" font-weight="400" text-anchor="start">Compare total bytes and task error under the same workload. No measured</text><text x="48" y="459" font-size="16" fill="#0e756d" font-weight="400" text-anchor="start">speedup is implied.</text></g></svg>