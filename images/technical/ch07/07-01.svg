<svg xmlns="http://www.w3.org/2000/svg" width="760" height="552" viewBox="0 0 760 552" role="img" aria-labelledby="title desc">
<title id="title">An orthogonal transform preserves geometry</title><desc id="desc">Rotation redistributes coordinates before quantization. Quantization itself introduces approximation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="550" rx="16" fill="#fbfaf7" stroke="#d8dedb" stroke-width="1.5"/><text x="32" y="36" font-size="13" fill="#0e756d" font-weight="700" text-anchor="start">CONCEPT 7.1  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#182d38" font-weight="600" text-anchor="start">An orthogonal transform preserves geometry</text><rect x="32" y="138" width="696" height="60" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="54" y="174" font-size="15" fill="#b94c27" font-weight="700" text-anchor="start">01</text><text x="110" y="175" font-size="21" fill="#182d38" font-weight="400" text-anchor="start">original vector x</text><rect x="32" y="214" width="696" height="60" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="54" y="250" font-size="15" fill="#b94c27" font-weight="700" text-anchor="start">02</text><text x="110" y="251" font-size="21" fill="#182d38" font-weight="400" text-anchor="start">rotated vector R*x</text><rect x="32" y="290" width="696" height="60" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="54" y="326" font-size="15" fill="#b94c27" font-weight="700" text-anchor="start">03</text><text x="110" y="327" font-size="21" fill="#182d38" font-weight="400" text-anchor="start">R_transpose * R = I</text><rect x="32" y="366" width="696" height="60" rx="12" fill="#e8f1ed" stroke="#cbd5d8" stroke-width="1.5"/><text x="54" y="402" font-size="15" fill="#b94c27" font-weight="700" text-anchor="start">04</text><text x="110" y="403" font-size="21" fill="#182d38" font-weight="400" text-anchor="start">length and dot products preserved</text><rect x="32" y="450" width="696" height="82" rx="12" fill="#eaf2ef" stroke="#d2e1db" stroke-width="1.5"/><text x="48" y="479" font-size="16" fill="#0e756d" font-weight="400" text-anchor="start">Rotation redistributes coordinates before quantization. Quantization itself</text><text x="48" y="503" font-size="16" fill="#0e756d" font-weight="400" text-anchor="start">introduces approximation.</text></g></svg>