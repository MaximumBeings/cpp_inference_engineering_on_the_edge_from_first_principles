<svg xmlns="http://www.w3.org/2000/svg" width="760" height="508" viewBox="0 0 760 508" role="img" aria-labelledby="title desc">
<title id="title">Cost estimation and fraud screening are separate outputs</title><desc id="desc">A high estimate does not itself imply fraud. Keep both outputs independently reviewable.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="506" rx="16" fill="#fbfaf7" stroke="#d8dedb" stroke-width="1.5"/><text x="32" y="36" font-size="13" fill="#a33516" font-weight="700" text-anchor="start">CONCEPT 28.3  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#182d38" font-weight="600" text-anchor="start">Cost estimation and fraud screening are</text><text x="32" y="112" font-size="27" fill="#182d38" font-weight="600" text-anchor="start">separate outputs</text><rect x="32" y="160" width="320" height="222" rx="12" fill="#ffe4d6" stroke="#cbd5d8" stroke-width="1.5"/><text x="50" y="194" font-size="20" fill="#a33516" font-weight="600" text-anchor="start">Damage estimate</text><text x="50" y="250" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">visible damage features</text><text x="50" y="290" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">reference pricing</text><text x="50" y="316" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">assumptions</text><text x="50" y="356" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">cost range and uncertainty</text><rect x="408" y="160" width="320" height="222" rx="12" fill="#faeee6" stroke="#cbd5d8" stroke-width="1.5"/><text x="426" y="194" font-size="20" fill="#9c3619" font-weight="600" text-anchor="start">Review signal</text><text x="426" y="250" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">reused photo candidate</text><text x="426" y="290" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">date inconsistency</text><text x="426" y="330" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">explainable escalation</text><rect x="32" y="406" width="696" height="82" rx="12" fill="#fff0e8" stroke="#e9b9a5" stroke-width="1.5"/><text x="48" y="435" font-size="16" fill="#a33516" font-weight="400" text-anchor="start">A high estimate does not itself imply fraud. Keep both outputs</text><text x="48" y="459" font-size="16" fill="#a33516" font-weight="400" text-anchor="start">independently reviewable.</text></g></svg>