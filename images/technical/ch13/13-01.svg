<svg xmlns="http://www.w3.org/2000/svg" width="760" height="574" viewBox="0 0 760 574" role="img" aria-labelledby="title desc">
<title id="title">The logical cache size grows with retained tokens</title><desc id="desc">This counts logical KV payload. Allocation, page metadata and quantization scales are additional.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="572" rx="16" fill="#fbfaf7" stroke="#d8dedb" stroke-width="1.5"/><text x="32" y="36" font-size="13" fill="#0e756d" font-weight="700" text-anchor="start">CONCEPT 13.1  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#182d38" font-weight="600" text-anchor="start">The logical cache size grows with retained</text><text x="32" y="112" font-size="27" fill="#182d38" font-weight="600" text-anchor="start">tokens</text><rect x="32" y="160" width="696" height="60" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="54" y="196" font-size="15" fill="#b94c27" font-weight="700" text-anchor="start">01</text><text x="110" y="197" font-size="21" fill="#182d38" font-weight="400" text-anchor="start">2 for K and V</text><rect x="32" y="236" width="696" height="60" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="54" y="272" font-size="15" fill="#b94c27" font-weight="700" text-anchor="start">02</text><text x="110" y="273" font-size="21" fill="#182d38" font-weight="400" text-anchor="start">* layers * KV heads</text><rect x="32" y="312" width="696" height="60" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="54" y="348" font-size="15" fill="#b94c27" font-weight="700" text-anchor="start">03</text><text x="110" y="349" font-size="21" fill="#182d38" font-weight="400" text-anchor="start">* tokens * head dimension</text><rect x="32" y="388" width="696" height="60" rx="12" fill="#e8f1ed" stroke="#cbd5d8" stroke-width="1.5"/><text x="54" y="424" font-size="15" fill="#b94c27" font-weight="700" text-anchor="start">04</text><text x="110" y="425" font-size="21" fill="#182d38" font-weight="400" text-anchor="start">* bytes per element</text><rect x="32" y="472" width="696" height="82" rx="12" fill="#eaf2ef" stroke="#d2e1db" stroke-width="1.5"/><text x="48" y="501" font-size="16" fill="#0e756d" font-weight="400" text-anchor="start">This counts logical KV payload. Allocation, page metadata and quantization</text><text x="48" y="525" font-size="16" fill="#0e756d" font-weight="400" text-anchor="start">scales are additional.</text></g></svg>