<svg xmlns="http://www.w3.org/2000/svg" width="760" height="486" viewBox="0 0 760 486" role="img" aria-labelledby="title desc">
<title id="title">Register width determines lane count</title><desc id="desc">These are storage lane counts; instruction semantics and accumulator width must be checked separately.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="484" rx="16" fill="#fbfaf7" stroke="#d8dedb" stroke-width="1.5"/><text x="32" y="36" font-size="13" fill="#0e756d" font-weight="700" text-anchor="start">CONCEPT 9.1  /  C++ INFERENCE AT THE EDGE</text><text x="32" y="78" font-size="27" fill="#182d38" font-weight="600" text-anchor="start">Register width determines lane count</text><rect x="32" y="138" width="320" height="222" rx="12" fill="#e8f1ed" stroke="#cbd5d8" stroke-width="1.5"/><text x="50" y="172" font-size="20" fill="#0e756d" font-weight="600" text-anchor="start">256-bit AVX2 register</text><text x="50" y="228" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">8 x FP32 lanes</text><text x="50" y="268" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">32 x INT8 lanes</text><text x="50" y="308" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">lane count depends on</text><text x="50" y="334" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">element width</text><rect x="408" y="138" width="320" height="222" rx="12" fill="#faeee6" stroke="#cbd5d8" stroke-width="1.5"/><text x="426" y="172" font-size="20" fill="#b94c27" font-weight="600" text-anchor="start">128-bit NEON register</text><text x="426" y="228" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">4 x FP32 lanes</text><text x="426" y="268" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">16 x INT8 lanes</text><text x="426" y="308" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">same arithmetic needs more</text><text x="426" y="334" font-size="18" fill="#182d38" font-weight="400" text-anchor="start">groups</text><rect x="32" y="384" width="696" height="82" rx="12" fill="#eaf2ef" stroke="#d2e1db" stroke-width="1.5"/><text x="48" y="413" font-size="16" fill="#0e756d" font-weight="400" text-anchor="start">These are storage lane counts; instruction semantics and accumulator width</text><text x="48" y="437" font-size="16" fill="#0e756d" font-weight="400" text-anchor="start">must be checked separately.</text></g></svg>