<svg xmlns="http://www.w3.org/2000/svg" width="760" height="718" viewBox="0 0 760 718" role="img" aria-labelledby="title desc">
<title id="title">Fit inference into a market-data latency budget</title><desc id="desc">Deadline handling is part of the decision path. An offline accuracy score does not establish live latency or trading performance.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993" /></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="716" rx="16" fill="#0b2e63" stroke="#375d8e" stroke-width="1.5" /><text x="32" y="36" font-size="13" fill="#8ed5c4" font-weight="700" text-anchor="start">C++ INFERENCE AT THE EDGE  /  OVERVIEW</text><text x="32" y="78" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">Fit inference into a market-data latency</text><text x="32" y="112" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">budget</text><text x="32" y="150" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">Deadline handling is part of the decision path.</text><rect x="32" y="192" width="320" height="184" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="50" y="219" font-size="13" fill="#f3b486" font-weight="700" text-anchor="start">01</text><text x="50" y="251" font-size="21" fill="#f5f4fa" font-weight="600" text-anchor="start">Market event</text><text x="50" y="305" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">Timestamp the incoming tick</text><rect x="408" y="192" width="320" height="184" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="426" y="219" font-size="13" fill="#f3b486" font-weight="700" text-anchor="start">02</text><text x="426" y="251" font-size="21" fill="#f5f4fa" font-weight="600" text-anchor="start">Compute features</text><text x="426" y="305" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">Book state and signal inputs</text><rect x="408" y="406" width="320" height="184" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="426" y="433" font-size="13" fill="#f3b486" font-weight="700" text-anchor="start">03</text><text x="426" y="465" font-size="21" fill="#f5f4fa" font-weight="600" text-anchor="start">Run inference</text><text x="426" y="519" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">Measure remaining budget</text><rect x="32" y="406" width="320" height="184" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="50" y="433" font-size="13" fill="#f3b486" font-weight="700" text-anchor="start">04</text><text x="50" y="465" font-size="21" fill="#f5f4fa" font-weight="600" text-anchor="start">Deadline decision</text><text x="50" y="519" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">Act, abstain or discard</text><text x="50" y="544" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">stale work</text><path d="M356 270 L402 270" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><path d="M568 380 L568 400" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><path d="M404 484 L358 484" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><rect x="32" y="616" width="696" height="82" rx="12" fill="#123e68" stroke="#467fac" stroke-width="1.5" /><text x="48" y="645" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">An offline accuracy score does not establish live latency or trading</text><text x="48" y="669" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">performance.</text></g></svg>