<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
<title id="title">Turn the forward pass into a command-line engine</title><desc id="desc">Parse input strictly and make capacity and numerical failures visible.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#738993"/></marker></defs>
<g font-family="Roboto, Arial, sans-serif"><rect x="1" y="1" width="1118" height="468" rx="18" fill="#fbfaf7" stroke="#d8dedb" stroke-width="1.5"/>
<path d="M32 38 H74" stroke="#c0441f" stroke-width="5" stroke-linecap="round"/>
<text x="32" y="83" font-size="29" fill="#182d38" font-weight="400">Turn the forward pass into a command-line engine</text>
<text x="32" y="124" font-size="18" fill="#526674" font-weight="400">Parse input strictly and make capacity and numerical failures visible.</text>
<rect x="32" y="183" width="246" height="145" rx="14" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><path d="M33 202 V309" stroke="#a33516" stroke-width="4"/><text x="49" y="219" font-size="22" fill="#182d38" font-weight="400">CLI and config</text><text x="49" y="270" font-size="17" fill="#526674" font-weight="400">Validate numeric</text><text x="49" y="295" font-size="17" fill="#526674" font-weight="400">options</text><path d="M279 255 H298" stroke="#738993" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/><rect x="302" y="183" width="246" height="145" rx="14" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><path d="M303 202 V309" stroke="#c0441f" stroke-width="4"/><text x="319" y="219" font-size="22" fill="#182d38" font-weight="400">Prefill</text><text x="319" y="270" font-size="17" fill="#526674" font-weight="400">Process the prompt</text><text x="319" y="295" font-size="17" fill="#526674" font-weight="400">tokens</text><path d="M549 255 H568" stroke="#738993" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/><rect x="572" y="183" width="246" height="145" rx="14" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><path d="M573 202 V309" stroke="#a33516" stroke-width="4"/><text x="589" y="219" font-size="22" fill="#182d38" font-weight="400">Decode loop</text><text x="589" y="270" font-size="17" fill="#526674" font-weight="400">Forward, sample,</text><text x="589" y="295" font-size="17" fill="#526674" font-weight="400">stream, append</text><path d="M819 255 H838" stroke="#738993" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/><rect x="842" y="183" width="246" height="145" rx="14" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><path d="M843 202 V309" stroke="#c0441f" stroke-width="4"/><text x="859" y="219" font-size="22" fill="#182d38" font-weight="400">Stop and report</text><text x="859" y="270" font-size="17" fill="#526674" font-weight="400">EOS, token limit or</text><text x="859" y="295" font-size="17" fill="#526674" font-weight="400">error</text><rect x="32" y="360" width="1056" height="78" rx="12" fill="#fff0e8" stroke="#e9b9a5" stroke-width="1.5"/><text x="50" y="392" font-size="19" fill="#a33516" font-weight="400">A repeated token receives one repetition penalty per sampling step.</text></g></svg>