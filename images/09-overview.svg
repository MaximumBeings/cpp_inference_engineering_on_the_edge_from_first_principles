<svg xmlns="http://www.w3.org/2000/svg" width="760" height="686" viewBox="0 0 760 686" role="img" aria-labelledby="title desc">
<title id="title">A dot product across SIMD lanes</title><desc id="desc">Accumulate independent products in a vector register before reducing them. Vector width, alignment, tail elements and ISA support all matter.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="684" rx="16" fill="#fbfaf7" stroke="#d8dedb" stroke-width="1.5"/><text x="32" y="36" font-size="13" fill="#0e756d" font-weight="700" text-anchor="start">C++ INFERENCE AT THE EDGE  /  OVERVIEW</text><text x="32" y="78" font-size="27" fill="#182d38" font-weight="600" text-anchor="start">A dot product across SIMD lanes</text><text x="32" y="116" font-size="18" fill="#526674" font-weight="400" text-anchor="start">Accumulate independent products in a vector register before reducing</text><text x="32" y="142" font-size="18" fill="#526674" font-weight="400" text-anchor="start">them.</text><rect x="32" y="184" width="320" height="184" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="50" y="211" font-size="13" fill="#b94c27" font-weight="700" text-anchor="start">01</text><text x="50" y="243" font-size="21" fill="#182d38" font-weight="600" text-anchor="start">Load lanes</text><text x="50" y="297" font-size="18" fill="#526674" font-weight="400" text-anchor="start">Read adjacent elements</text><rect x="408" y="184" width="320" height="184" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="426" y="211" font-size="13" fill="#b94c27" font-weight="700" text-anchor="start">02</text><text x="426" y="243" font-size="21" fill="#182d38" font-weight="600" text-anchor="start">Multiply</text><text x="426" y="297" font-size="18" fill="#526674" font-weight="400" text-anchor="start">Pair corresponding values</text><rect x="408" y="398" width="320" height="184" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="426" y="425" font-size="13" fill="#b94c27" font-weight="700" text-anchor="start">03</text><text x="426" y="457" font-size="21" fill="#182d38" font-weight="600" text-anchor="start">Accumulate</text><text x="426" y="511" font-size="18" fill="#526674" font-weight="400" text-anchor="start">Keep partial sums in lanes</text><rect x="32" y="398" width="320" height="184" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="50" y="425" font-size="13" fill="#b94c27" font-weight="700" text-anchor="start">04</text><text x="50" y="457" font-size="21" fill="#182d38" font-weight="600" text-anchor="start">Reduce</text><text x="50" y="511" font-size="18" fill="#526674" font-weight="400" text-anchor="start">Combine into one scalar</text><path d="M356 262 L402 262" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><path d="M568 372 L568 392" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><path d="M404 476 L358 476" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="608" width="696" height="58" rx="12" fill="#eaf2ef" stroke="#d2e1db" stroke-width="1.5"/><text x="48" y="637" font-size="16" fill="#0e756d" font-weight="400" text-anchor="start">Vector width, alignment, tail elements and ISA support all matter.</text></g></svg>