<svg xmlns="http://www.w3.org/2000/svg" width="760" height="694" viewBox="0 0 760 694" role="img" aria-labelledby="title desc">
<title id="title">Quantize a vector in a rotated coordinate system</title><desc id="desc">Use a reconstruction stage and a residual correction for inner products. Keep the MSE reconstruction, residual and query in compatible coordinates.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="692" rx="16" fill="#fbfaf7" stroke="#d8dedb" stroke-width="1.5"/><text x="32" y="36" font-size="13" fill="#0e756d" font-weight="700" text-anchor="start">C++ INFERENCE AT THE EDGE  /  OVERVIEW</text><text x="32" y="78" font-size="27" fill="#182d38" font-weight="600" text-anchor="start">Quantize a vector in a rotated coordinate</text><text x="32" y="112" font-size="27" fill="#182d38" font-weight="600" text-anchor="start">system</text><text x="32" y="150" font-size="18" fill="#526674" font-weight="400" text-anchor="start">Use a reconstruction stage and a residual correction for inner products.</text><rect x="32" y="192" width="320" height="184" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="50" y="219" font-size="13" fill="#b94c27" font-weight="700" text-anchor="start">01</text><text x="50" y="251" font-size="21" fill="#182d38" font-weight="600" text-anchor="start">Rotate</text><text x="50" y="305" font-size="18" fill="#526674" font-weight="400" text-anchor="start">Spread energy across</text><text x="50" y="330" font-size="18" fill="#526674" font-weight="400" text-anchor="start">coordinates</text><rect x="408" y="192" width="320" height="184" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="426" y="219" font-size="13" fill="#b94c27" font-weight="700" text-anchor="start">02</text><text x="426" y="251" font-size="21" fill="#182d38" font-weight="600" text-anchor="start">MSE quantizer</text><text x="426" y="305" font-size="18" fill="#526674" font-weight="400" text-anchor="start">Map values to a codebook</text><rect x="408" y="406" width="320" height="184" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="426" y="433" font-size="13" fill="#b94c27" font-weight="700" text-anchor="start">03</text><text x="426" y="465" font-size="21" fill="#182d38" font-weight="600" text-anchor="start">Residual sketch</text><text x="426" y="519" font-size="18" fill="#526674" font-weight="400" text-anchor="start">QJL corrects the dot</text><text x="426" y="544" font-size="18" fill="#526674" font-weight="400" text-anchor="start">estimate</text><rect x="32" y="406" width="320" height="184" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="50" y="433" font-size="13" fill="#b94c27" font-weight="700" text-anchor="start">04</text><text x="50" y="465" font-size="21" fill="#182d38" font-weight="600" text-anchor="start">Estimate</text><text x="50" y="519" font-size="18" fill="#526674" font-weight="400" text-anchor="start">Combine both terms</text><path d="M356 270 L402 270" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><path d="M568 380 L568 400" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><path d="M404 484 L358 484" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="616" width="696" height="58" rx="12" fill="#eaf2ef" stroke="#d2e1db" stroke-width="1.5"/><text x="48" y="645" font-size="16" fill="#0e756d" font-weight="400" text-anchor="start">Keep the MSE reconstruction, residual and query in compatible coordinates.</text></g></svg>