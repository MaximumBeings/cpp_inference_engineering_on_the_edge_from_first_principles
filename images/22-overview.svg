<svg xmlns="http://www.w3.org/2000/svg" width="760" height="710" viewBox="0 0 760 710" role="img" aria-labelledby="title desc">
<title id="title">Combine visual findings with context</title><desc id="desc">Security, accessibility and provenance examples use explicit evidence and review. A model’s description alone does not establish identity, authenticity or intent.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993" /></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="708" rx="16" fill="#0b2e63" stroke="#375d8e" stroke-width="1.5" /><text x="32" y="36" font-size="13" fill="#8ed5c4" font-weight="700" text-anchor="start">C++ INFERENCE AT THE EDGE  /  OVERVIEW</text><text x="32" y="78" font-size="27" fill="#f5f4fa" font-weight="600" text-anchor="start">Combine visual findings with context</text><text x="32" y="116" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">Security, accessibility and provenance examples use explicit evidence</text><text x="32" y="142" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">and review.</text><rect x="32" y="184" width="320" height="184" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="50" y="211" font-size="13" fill="#f3b486" font-weight="700" text-anchor="start">01</text><text x="50" y="243" font-size="21" fill="#f5f4fa" font-weight="600" text-anchor="start">Capture evidence</text><text x="50" y="297" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">Image, place and timestamp</text><rect x="408" y="184" width="320" height="184" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="426" y="211" font-size="13" fill="#f3b486" font-weight="700" text-anchor="start">02</text><text x="426" y="243" font-size="21" fill="#f5f4fa" font-weight="600" text-anchor="start">Extract findings</text><text x="426" y="297" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">Objects, text and conditions</text><rect x="408" y="398" width="320" height="184" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="426" y="425" font-size="13" fill="#f3b486" font-weight="700" text-anchor="start">03</text><text x="426" y="457" font-size="21" fill="#f5f4fa" font-weight="600" text-anchor="start">Check context</text><text x="426" y="511" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">Rules, history and</text><text x="426" y="536" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">provenance</text><rect x="32" y="398" width="320" height="184" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="50" y="425" font-size="13" fill="#f3b486" font-weight="700" text-anchor="start">04</text><text x="50" y="457" font-size="21" fill="#f5f4fa" font-weight="600" text-anchor="start">Review outcome</text><text x="50" y="511" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">Human assessment and audit</text><path d="M356 262 L402 262" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><path d="M568 372 L568 392" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><path d="M404 476 L358 476" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><rect x="32" y="608" width="696" height="82" rx="12" fill="#123e68" stroke="#467fac" stroke-width="1.5" /><text x="48" y="637" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">A model’s description alone does not establish identity, authenticity or</text><text x="48" y="661" font-size="16" fill="#8ed5c4" font-weight="400" text-anchor="start">intent.</text></g></svg>