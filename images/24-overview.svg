<svg xmlns="http://www.w3.org/2000/svg" width="760" height="720" viewBox="0 0 760 720" role="img" aria-labelledby="title desc">
<title id="title">Translate an edit request into image operations</title><desc id="desc">A validated operation plan connects natural language with the image processor. Validate the plan before it reaches cv::Mat operations.</desc>
