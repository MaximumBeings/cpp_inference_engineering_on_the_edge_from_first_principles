d38" font-weight="600" text-anchor="start">Validate</text><text x="426" y="545" font-size="18" fill="#526674" font-weight="400" text-anchor="start">Bounds and supported actions</text><rect x="32" y="432" width="320" height="184" rx="12" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><text x="50" y="459" font-size="13" fill="#b94c27" font-weight="700" text-anchor="start">04</text><text x="50" y="491" font-size="21" fill="#182d38" font-weight="600" text-anchor="start">Apply edit</text><text x="50" y="545" font-size="18" fill="#526674" font-weight="400" text-anchor="start">Run the image operations</text><path d="M356 296 L402 296" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><path d="M568 406 L568 426" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><path d="M404 510 L358 510" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="642" width="696" height="58" rx="12" fill="#eaf2ef" stroke="#d2e1db" stroke-width="1.5"/><text x="48" y="671" font-size="16" fill="#0e756d" font-weight="400" text-anchor="start">Validate the plan before it reaches cv::Mat operations.</text></g></svg>