<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1248" viewBox="0 0 760 1248" role="img" aria-labelledby="title desc">
<title id="title">From first principles to a deployable edge engine</title><desc id="desc">The complete book connects model representation, C++ kernels, serving state, hardware limits and practical applications.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738993" /></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="1246" rx="16" fill="#0b2e63" stroke="#375d8e" stroke-width="1.5" /><text x="32" y="36" font-size="13" fill="#8ed5c4" font-weight="700" text-anchor="start">THE BOOK AT A GLANCE  /  C++23 INFERENCE</text><text x="32" y="80" font-size="29" fill="#f5f4fa" font-weight="600" text-anchor="start">From first principles to a deployable edge</text><text x="32" y="117" font-size="29" fill="#f5f4fa" font-weight="600" text-anchor="start">engine</text><rect x="32" y="160" width="696" height="88" rx="12" fill="#123e68" stroke="#467fac" stroke-width="1.5" /><text x="50" y="189" font-size="14" fill="#8ed5c4" font-weight="700" text-anchor="start">DESIGN FOR A FIXED DEVICE BUDGET</text><text x="50" y="222" font-size="18" fill="#f5f4fa" font-weight="500" text-anchor="start">RAM  /  memory bandwidth  /  latency  /  power and thermals</text><text x="32" y="292" font-size="17" fill="#8ed5c4" font-weight="700" text-anchor="start">BUILD THE LOCAL INFERENCE ENGINE</text><rect x="32" y="316" width="320" height="154" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="48" y="343" font-size="13" fill="#f3b486" font-weight="700" text-anchor="start">PART 0</text><text x="48" y="374" font-size="20" fill="#f5f4fa" font-weight="600" text-anchor="start">Tensors and compute graphs</text><text x="48" y="409" font-size="17" fill="#bdc9df" font-weight="400" text-anchor="start">mdspan, arenas, mixed</text><text x="48" y="433" font-size="17" fill="#bdc9df" font-weight="400" text-anchor="start">precision; transformer</text><text x="48" y="457" font-size="17" fill="#bdc9df" font-weight="400" text-anchor="start">operators</text><rect x="408" y="316" width="320" height="154" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="424" y="343" font-size="13" fill="#f3b486" font-weight="700" text-anchor="start">PART 1</text><text x="424" y="374" font-size="20" fill="#f5f4fa" font-weight="600" text-anchor="start">Compact model storage</text><text x="424" y="409" font-size="17" fill="#bdc9df" font-weight="400" text-anchor="start">Quantization, GGUF/SafeTensors,</text><text x="424" y="433" font-size="17" fill="#bdc9df" font-weight="400" text-anchor="start">mmap and TurboQuant</text><rect x="32" y="494" width="320" height="154" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="48" y="521" font-size="13" fill="#f3b486" font-weight="700" text-anchor="start">PART 2</text><text x="48" y="552" font-size="20" fill="#f5f4fa" font-weight="600" text-anchor="start">Fast CPU kernels</text><text x="48" y="587" font-size="17" fill="#bdc9df" font-weight="400" text-anchor="start">Roofline analysis, AVX2/NEON,</text><text x="48" y="611" font-size="17" fill="#bdc9df" font-weight="400" text-anchor="start">cache behavior and threads</text><rect x="408" y="494" width="320" height="154" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="424" y="521" font-size="13" fill="#f3b486" font-weight="700" text-anchor="start">PART 3</text><text x="424" y="552" font-size="20" fill="#f5f4fa" font-weight="600" text-anchor="start">Tokenization and KV state</text><text x="424" y="587" font-size="17" fill="#bdc9df" font-weight="400" text-anchor="start">BPE, paged/ring KV caches,</text><text x="424" y="611" font-size="17" fill="#bdc9df" font-weight="400" text-anchor="start">eviction and prefix reuse</text><rect x="32" y="672" width="320" height="154" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="48" y="699" font-size="13" fill="#f3b486" font-weight="700" text-anchor="start">PART 4</text><text x="48" y="730" font-size="20" fill="#f5f4fa" font-weight="600" text-anchor="start">Integrated model runtime</text><text x="48" y="765" font-size="17" fill="#bdc9df" font-weight="400" text-anchor="start">Real weights to tokens;</text><text x="48" y="789" font-size="17" fill="#bdc9df" font-weight="400" text-anchor="start">streaming, profiling and</text><text x="48" y="813" font-size="17" fill="#bdc9df" font-weight="400" text-anchor="start">benchmarks</text><rect x="408" y="672" width="320" height="154" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5" /><text x="424" y="699" font-size="13" fill="#f3b486" font-weight="700" text-anchor="start">PART 6</text><text x="424" y="730" font-size="20" fill="#f5f4fa" font-weight="600" text-anchor="start">Math and GPU kernels</text><text x="424" y="765" font-size="17" fill="#bdc9df" font-weight="400" text-anchor="start">Stable numerics, continuous</text><text x="424" y="789" font-size="17" fill="#bdc9df" font-weight="400" text-anchor="start">batching, tiled attention and</text><text x="424" y="813" font-size="17" fill="#bdc9df" font-weight="400" text-anchor="start">CUDA</text><path d="M380 834 L380 876" fill="none" stroke="#738993" stroke-width="2" marker-end="url(#arrow)" /><rect x="32" y="882" width="696" height="152" rx="12" fill="#123e68" stroke="#5b83b5" stroke-width="1.5" /><text x="50" y="913" font-size="14" fill="#8ed5c4" font-weight="700" text-anchor="start">PART 5  /  PUT THE ENGINE TO WORK</text><text x="50" y="950" font-size="23" fill="#f5f4fa" font-weight="600" text-anchor="start">Local language and vision-language applications</text><text x="50" y="984" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">Inspection, inventory, documents, imaging triage, accessibility, fraud</text><text x="50" y="1010" font-size="18" fill="#bdc9df" font-weight="400" text-anchor="start">screening and market-signal examples</text><rect x="32" y="1062" width="696" height="112" rx="12" fill="#214b7b" stroke="#5b83b5" stroke-width="1.5" /><text x="50" y="1094" font-size="14" fill="#f3b486" font-weight="700" text-anchor="start">VERIFY AT EVERY LAYER</text><text x="50" y="1128" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">Build and test C++ examples; check numeric results and memory behavior;</text><text x="50" y="1154" font-size="18" fill="#f5f4fa" font-weight="400" text-anchor="start">validate target execution and report measurement limits.</text><text x="32" y="1216" font-size="17" fill="#8ed5c4" font-weight="500" text-anchor="start">From model bytes and input tokens to useful output on a constrained device.</text></g></svg>