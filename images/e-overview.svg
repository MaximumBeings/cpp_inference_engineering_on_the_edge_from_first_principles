<rect x="32" y="183" width="246" height="145" rx="14" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><path d="M33 202 V309" stroke="#a33516" stroke-width="4"/><text x="49" y="219" font-size="22" fill="#182d38" font-weight="400">Tensor API</text><text x="49" y="270" font-size="17" fill="#526674" font-weight="400">Storage, shape and</text><text x="49" y="295" font-size="17" fill="#526674" font-weight="400">layout</text><path d="M279 255 H298" stroke="#738993" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/><rect x="302" y="183" width="246" height="145" rx="14" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><path d="M303 202 V309" stroke="#c0441f" stroke-width="4"/><text x="319" y="219" font-size="22" fill="#182d38" font-weight="400">Model loader</text><text x="319" y="270" font-size="17" fill="#526674" font-weight="400">Metadata and typed</text><text x="319" y="295" font-size="17" fill="#526674" font-weight="400">weights</text><path d="M549 255 H568" stroke="#738993" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/><rect x="572" y="183" width="246" height="145" rx="14" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><path d="M573 202 V309" stroke="#a33516" stroke-width="4"/><text x="589" y="219" font-size="22" fill="#182d38" font-weight="400">Tokenizer</text><text x="589" y="270" font-size="17" fill="#526674" font-weight="400">Vocabulary and byte</text><text x="589" y="295" font-size="17" fill="#526674" font-weight="400">handling</text><path d="M819 255 H838" stroke="#738993" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/><rect x="842" y="183" width="246" height="145" rx="14" fill="#fff" stroke="#cbd5d8" stroke-width="1.5"/><path d="M843 202 V309" stroke="#c0441f" stroke-width="4"/><text x="859" y="219" font-size="22" fill="#182d38" font-weight="400">Serving runtime</text><text x="859" y="270" font-size="17" fill="#526674" font-weight="400">KV state and scheduling</text><rect x="32" y="360" width="1056" height="78" rx="12" fill="#fff0e8